<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_3_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_3_12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_3_12)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#a855f7" filter="url(#glow_tf_3_12)"/>
  <text x="50" y="32" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 3: CHEMICAL EQUATIONS • Q12</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#a855f7"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">BALANCING EQUATION</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2"/>
  <text x="270" y="86" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">LAW OF CONSERVATION OF MASS: ATOM INVENTORY</text>
  
  <rect x="60" y="105" width="180" height="60" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
  <text x="150" y="128" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">REACTANT ATOMS</text>
  <text x="150" y="150" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">Total Count (Left)</text>

  <text x="270" y="140" fill="#22c55e" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle">=</text>

  <rect x="300" y="105" width="180" height="60" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
  <text x="390" y="128" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PRODUCT ATOMS</text>
  <text x="390" y="150" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">Total Count (Right)</text>

  <rect x="80" y="180" width="380" height="30" rx="8" fill="#020617" stroke="#8b5cf6" stroke-width="1"/>
  <text x="270" y="200" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Adjust ONLY Coefficients (e.g. 2 H₂O) • NEVER Subscripts</text>
            
</svg>