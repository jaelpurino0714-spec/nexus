<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t3_tf_12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t3_tf_12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t3_tf_12)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#6366f1" filter="url(#glow_t3_tf_12)"/>
  <text x="50" y="32" fill="#6366f1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 3: BALANCING CHEMICAL EQUATIONS • Q12</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#6366f1"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATIONS</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      STOICHIOMETRIC COEFFICIENTS
    </text>

    <!-- Specific Visual Elements -->
    <g transform="translate(110, 32)">
           <rect x="20" y="15" width="220" height="65" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
           <text x="50" y="55" fill="#fbbf24" font-family="monospace" font-size="28" font-weight="900">2</text>
           <text x="85" y="53" fill="#ffffff" font-family="monospace" font-size="20" font-weight="900">H₂O</text>
           <text x="160" y="42" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="900">COEFFICIENT</text>
           <text x="160" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="600">Multiplies entire unit</text>
         </g>

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Coefficients specify the number of discrete molecules or moles reacting
      </text>
    </g>
  </g>
</svg>