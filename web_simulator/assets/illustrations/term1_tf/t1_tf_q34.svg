  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_tf_1_34)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL &amp; CHEMICAL CHANGES • Q34</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#ec4899"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">OXIDATION REACTION</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="270" y="88" fill="#fb7185" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">CORROSION / OXIDATION PROCESS</text>
  <rect x="90" y="125" width="160" height="12" rx="3" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="250,123 275,131 250,139" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="140" y="122" width="110" height="18" rx="4" fill="#ea580c" fill-opacity="0.75" stroke="#f97316" stroke-width="1.2"/>
  <text x="195" y="165" fill="#fdba74" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Rust: Fe₂O₃ · xH₂O</text>
  
  <rect x="310" y="105" width="170" height="95" rx="10" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1"/>
  <text x="395" y="130" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Reactants:</text>
  <text x="395" y="148" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4Fe + 3O₂ + 2xH₂O</text>
  <text x="395" y="172" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">New Chemical Bonds</text>
  <text x="395" y="188" fill="#4ade80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Irreversible Change</text>
            
</svg>