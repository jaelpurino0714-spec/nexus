<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_2_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_2_1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_2_1)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#06b6d4" filter="url(#glow_tf_2_1)"/>
  <text x="50" y="32" fill="#06b6d4" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: ACIDS, BASES &amp; SALTS • Q1</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#06b6d4"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">LITMUS INDICATOR</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="210" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.2"/>
  <text x="145" y="86" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ACIDIC (pH &lt; 7)</text>
  <path d="M 115 110 L 115 160 Q 115 170 125 170 L 165 170 Q 175 170 175 160 L 175 110" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
  <rect x="138" y="100" width="14" height="65" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="145" y="195" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Turns Litmus RED</text>

  <rect x="290" y="60" width="210" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="395" y="86" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">BASIC (pH &gt; 7)</text>
  <path d="M 365 110 L 365 160 Q 365 170 375 170 L 415 170 Q 425 170 425 160 L 425 110" fill="#2563eb" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
  <rect x="388" y="100" width="14" height="65" rx="3" fill="#2563eb" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="395" y="195" fill="#bfdbfe" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Turns Litmus BLUE</text>
            
</svg>