<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_tf_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t2_tf_1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_tf_1)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_t2_tf_1)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: ACIDS, BASES &amp; SALTS • Q1</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#ec4899"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">ACID-BASE</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#ec4899" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      ACID PROPERTIES: SOUR TASTE &amp;amp; BLUE LITMUS RED
    </text>

    <!-- Specific Visual Elements -->
    
    <g>
      <!-- Test Tube Glass -->
      <rect x="235" y="35" width="30" height="65" rx="15" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 236 60 L 236 85 Q 236 99 250 99 Q 264 99 264 85 L 264 60 Z" fill="#ef4444" opacity="0.8"/>
      <!-- Litmus Paper Strip Dipping In -->
      <rect x="245" y="25" width="10" height="35" rx="2" fill="#3b82f6"/>
      <rect x="245" y="60" width="10" height="25" rx="2" fill="#ef4444"/>
      <text x="250" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Blue Litmus → Red</text>
    </g>
    

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Acids release H⁺ ions in aqueous solution, turning blue litmus paper red
      </text>
    </g>
  </g>
</svg>