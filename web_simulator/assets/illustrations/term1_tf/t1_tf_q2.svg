<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_1_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_1_2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_1_2)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_tf_1_2)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL &amp; CHEMICAL CHANGES • Q2</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#ec4899"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">PHASE CHANGE</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="200" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="140" y="86" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">SOLID (ICE)</text>
  <polygon points="140,105 180,120 140,135 100,120" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
  <polygon points="100,120 140,135 140,175 100,160" fill="#0369a1" stroke="#7dd3fc" stroke-width="1.5"/>
  <polygon points="180,120 140,135 140,175 180,160" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="140" y="202" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">H₂O(s) Rigid Crystal</text>

  <g transform="translate(245, 125)">
    <line x1="0" y1="15" x2="50" y2="15" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="55,15 44,9 44,21" fill="#f43f5e"/>
    <text x="25" y="2" fill="#fb7185" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">HEAT (Δ)</text>
  </g>

  <rect x="300" y="60" width="200" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="86" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">LIQUID WATER</text>
  <path d="M 370 110 L 370 165 Q 370 175 380 175 L 420 175 Q 430 175 430 165 L 430 110" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 372 135 Q 400 130 428 135 L 428 165 Q 428 173 420 173 L 380 173 Q 372 173 372 165 Z" fill="#38bdf8" fill-opacity="0.5"/>
  <text x="400" y="202" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">H₂O(l) Free Flowing</text>
            
</svg>