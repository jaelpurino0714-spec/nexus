<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t3_tf_23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t3_tf_23" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t3_tf_23)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#6366f1" filter="url(#glow_t3_tf_23)"/>
  <text x="50" y="32" fill="#6366f1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 3: BALANCING CHEMICAL EQUATIONS • Q23</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#6366f1"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATIONS</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      PURPOSE OF BALANCING: CONSERVATION OF MASS
    </text>

    <!-- Specific Visual Elements -->
    
    <g transform="translate(0, 34)">
      <!-- Scale Fulcrum & Stand -->
      <polygon points="245,45 230,85 260,85" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <rect x="215" y="85" width="60" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <!-- Balance Beam -->
      <line x1="80" y1="50" x2="410" y2="50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <!-- Left Pan -->
      <line x1="120" y1="50" x2="90" y2="75" stroke="#64748b" stroke-width="1.5"/>
      <line x1="120" y1="50" x2="150" y2="75" stroke="#64748b" stroke-width="1.5"/>
      <rect x="80" y="75" width="80" height="22" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="120" y="90" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">Law of Mass Conservation</text>
      <!-- Right Pan -->
      <line x1="370" y1="50" x2="340" y2="75" stroke="#64748b" stroke-width="1.5"/>
      <line x1="370" y1="50" x2="400" y2="75" stroke="#64748b" stroke-width="1.5"/>
      <rect x="330" y="75" width="80" height="22" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="370" y="90" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">Equal Atom Counts</text>
      <!-- Center Indicator -->
      <text x="245" y="32" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">BALANCED: Atom Counts Equal on Both Sides</text>
    </g>
    

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Chemical equations are balanced to uphold the fundamental Law of Conservation of Mass
      </text>
    </g>
  </g>
</svg>