<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_4_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_4_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_4_4)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#f59e0b" filter="url(#glow_tf_4_4)"/>
  <text x="50" y="32" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 4: RATES OF REACTIONS • Q4</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#f59e0b"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">TEMPERATURE &amp; RATE</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="210" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="145" y="86" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">LOWER TEMPERATURE</text>
  <circle cx="100" cy="130" r="8" fill="#0284c7"/><line x1="100" y1="130" x2="85" y2="130" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="150" cy="155" r="8" fill="#0284c7"/><line x1="150" y1="155" x2="165" y2="155" stroke="#38bdf8" stroke-width="2"/>
  <text x="145" y="198" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Lower Kinetic Energy (Slower)</text>

  <rect x="290" y="60" width="210" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.2"/>
  <text x="395" y="86" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">HIGHER TEMPERATURE</text>
  <circle cx="350" cy="125" r="8" fill="#dc2626"/><line x1="350" y1="125" x2="315" y2="125" stroke="#ef4444" stroke-width="3"/>
  <circle cx="405" cy="150" r="8" fill="#dc2626"/><line x1="405" y1="150" x2="435" y2="150" stroke="#ef4444" stroke-width="3"/>
  <text x="395" y="198" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Frequent Collisions (Faster)</text>
            
</svg>