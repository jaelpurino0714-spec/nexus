<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t1_tf_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t1_tf_5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t1_tf_5)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#06b6d4" filter="url(#glow_t1_tf_5)"/>
  <text x="50" y="32" fill="#06b6d4" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL &amp; CHEMICAL CHANGES • Q5</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#06b6d4"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EXPERIMENT</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      EFFERVESCENCE: VINEGAR + BAKING SODA
    </text>

    <!-- Specific Visual Elements -->
    
    <g>
      <!-- Beaker Rim & Glass Body -->
      <path d="M 210 30 L 215 30 L 220 95 Q 220 100 225 100 L 265 100 Q 270 100 270 95 L 275 30 L 280 30" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Liquid Fill -->
      <path d="M 221 55 L 221 95 Q 221 99 225 99 L 265 99 Q 269 99 269 95 L 269 55 Z" fill="#38bdf8" opacity="0.75"/>
      <!-- Meniscus line -->
      <ellipse cx="245" cy="55" rx="24" ry="4" fill="#38bdf8" opacity="0.9"/>
      <!-- Measurement ticks -->
      <line x1="223" y1="50" x2="231" y2="50" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="223" y1="65" x2="233" y2="65" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="223" y1="80" x2="231" y2="80" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      
        <circle cx="230" cy="80" r="3" fill="#ffffff" opacity="0.6"/>
        <circle cx="250" cy="70" r="2" fill="#ffffff" opacity="0.8"/>
        <circle cx="240" cy="55" r="2.5" fill="#ffffff" opacity="0.5"/>
        <circle cx="260" cy="60" r="3.5" fill="#ffffff" opacity="0.7"/>
        
      <text x="245" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CO₂ Bubbles Forming</text>
    </g>
    

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂↑ (Gas evolution evidence)
      </text>
    </g>
  </g>
</svg>