<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_3_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_3_8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_3_8)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#a855f7" filter="url(#glow_tf_3_8)"/>
  <text x="50" y="32" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 3: CHEMICAL EQUATIONS • Q8</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#a855f7"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION ANATOMY</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2"/>
  <rect x="60" y="80" width="420" height="60" rx="10" fill="#020617" stroke="#a855f7" stroke-width="1.2"/>
  <text x="150" y="115" fill="#f43f5e" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle">Reactants(s)</text>
  <text x="270" y="115" fill="#facc15" font-family="'Courier New', monospace" font-size="18" font-weight="900" text-anchor="middle">→ [Yield]</text>
  <text x="390" y="115" fill="#34d399" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle">Products(aq)</text>

  <rect x="70" y="160" width="85" height="38" rx="6" fill="#1e1b4b"/>
  <text x="112" y="183" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">(s) = Solid</text>

  <rect x="170" y="160" width="85" height="38" rx="6" fill="#1e1b4b"/>
  <text x="212" y="183" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">(l) = Liquid</text>

  <rect x="270" y="160" width="85" height="38" rx="6" fill="#1e1b4b"/>
  <text x="312" y="183" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">(g) = Gas</text>

  <rect x="370" y="160" width="100" height="38" rx="6" fill="#1e1b4b"/>
  <text x="420" y="183" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">(aq) = Aqueous</text>
            
</svg>