    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#3b82f6" filter="url(#glow_tf_6_14)"/>
  <text x="50" y="32" fill="#3b82f6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 6: EVOLUTION • Q14</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#3b82f6"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">FOSSIL RECORD</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="270" y="84" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">LAW OF SUPERPOSITION (STRATIGRAPHY)</text>
  <rect x="70" y="98" width="400" height="28" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <text x="270" y="116" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Top Layer: Youngest Rock &amp; Complex Fossils</text>

  <rect x="70" y="128" width="400" height="28" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="270" y="146" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Intermediate Layer: Transitional Fossils</text>

  <rect x="70" y="158" width="400" height="28" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="270" y="176" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Deepest Layer: Oldest Sediments &amp; Ancestral Life</text>

  <text x="270" y="210" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Deeper rock layers contain older chronological geological evidence</text>
            
