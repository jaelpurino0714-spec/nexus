<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_1_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_1_8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_1_8)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_tf_1_8)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL &amp; CHEMICAL CHANGES • Q8</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#ec4899"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">PHYSICAL CHANGE</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="270" y="88" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">MOLECULAR COMPOSITION REMAINS IDENTICAL</text>
  
  <rect x="65" y="108" width="175" height="95" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="152" y="132" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Before Process</text>
  <circle cx="120" cy="160" r="10" fill="#3b82f6"/>
  <circle cx="150" cy="160" r="10" fill="#3b82f6"/>
  <circle cx="180" cy="160" r="10" fill="#3b82f6"/>
  <text x="152" y="192" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Pure Substance</text>

  <text x="270" y="155" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">→</text>

  <rect x="300" y="108" width="175" height="95" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="387" y="132" fill="#6ee7b7" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">After Process</text>
  <circle cx="355" cy="155" r="7" fill="#3b82f6"/>
  <circle cx="385" cy="165" r="7" fill="#3b82f6"/>
  <circle cx="415" cy="155" r="7" fill="#3b82f6"/>
  <text x="387" y="192" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">No New Chemical Bonds</text>
            
</svg>