  <path d="M 80 180 Q 200 130 270 130 Q 340 130 440 180" fill="none" stroke="#10b981" stroke-width="3"/>
  <text x="270" y="148" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">With Catalyst (Lower Ea)</text>
  
  <text x="270" y="205" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Catalyst Speeds Up Rate without Being Consumed in Reaction</text>
            
