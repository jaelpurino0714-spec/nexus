    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#f59e0b" filter="url(#glow_tf_4_18)"/>
  <text x="50" y="32" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 4: RATES OF REACTIONS • Q18</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#f59e0b"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">CATALYST ACTION</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="270" y="86" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">ACTIVATION ENERGY (Ea) BARRIER REDUCTION</text>
  <path d="M 80 180 Q 200 90 270 90 Q 340 90 440 180" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
