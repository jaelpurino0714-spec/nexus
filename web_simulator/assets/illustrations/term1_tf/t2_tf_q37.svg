<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_tf_37" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t2_tf_37" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_tf_37)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_t2_tf_37)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: ACIDS, BASES &amp; SALTS • Q37</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#ec4899"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">ACID-BASE</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#ec4899" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      ALKALIS: WATER-SOLUBLE BASES
    </text>

    <!-- Specific Visual Elements -->
    <g transform="translate(120, 25)">
           
    <g>
      <!-- Beaker Rim & Glass Body -->
      <path d="M 45 30 L 50 30 L 55 95 Q 55 100 60 100 L 100 100 Q 105 100 105 95 L 110 30 L 115 30" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Liquid Fill -->
      <path d="M 56 55 L 56 95 Q 56 99 60 99 L 100 99 Q 104 99 104 95 L 104 55 Z" fill="#8b5cf6" opacity="0.75"/>
      <!-- Meniscus line -->
      <ellipse cx="80" cy="55" rx="24" ry="4" fill="#8b5cf6" opacity="0.9"/>
      <!-- Measurement ticks -->
      <line x1="58" y1="50" x2="66" y2="50" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="58" y1="65" x2="68" y2="65" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="58" y1="80" x2="66" y2="80" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      
      <text x="80" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Alkali Solution</text>
    </g>
    
           <g transform="translate(145, 35)">
             <text x="0" y="22" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="900">Soluble Bases = Alkalis</text>
             <text x="0" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="700">Releases mobile OH⁻ in water</text>
           </g>
         </g>

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        All alkalis are bases that dissolve in water, releasing hydroxide ions (OH⁻)
      </text>
    </g>
  </g>
</svg>