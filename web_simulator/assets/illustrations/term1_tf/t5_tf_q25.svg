<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t5_tf_25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t5_tf_25" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t5_tf_25)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#10b981" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#10b981" filter="url(#glow_t5_tf_25)"/>
  <text x="50" y="32" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 5: HOMEOSTASIS AND REGULATION • Q25</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#10b981"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">REGULATION</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      PULMONARY GAS EXCHANGE DURING EXERCISE
    </text>

    <!-- Specific Visual Elements -->
    
    <g transform="translate(15, 30)">
      <!-- 1. Stimulus -->
      <rect x="15" y="10" width="105" height="36" rx="8" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.5"/>
      <text x="67" y="32" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">CO₂ Buildup</text>

      <!-- Arrow 1 -> 2 -->
      <line x1="125" y1="28" x2="165" y2="28" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="170,28 160,24 160,32" fill="#f472b6"/>

      <!-- 2. Receptor -->
      <rect x="175" y="10" width="110" height="36" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="230" y="32" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">Chemoreceptors</text>

      <!-- Arrow 2 -> 3 -->
      <path d="M 290 28 Q 340 28 340 55" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <polygon points="340,60 335,50 345,50" fill="#38bdf8"/>

      <!-- 3. Control Center -->
      <rect x="270" y="65" width="140" height="36" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="340" y="87" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">Medulla Oblongata</text>

      <!-- Arrow 3 -> 4 -->
      <line x1="265" y1="83" x2="225" y2="83" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="220,83 230,79 230,87" fill="#fbbf24"/>

      <!-- 4. Effector -->
      <rect x="105" y="65" width="110" height="36" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
      <text x="160" y="87" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">Diaphragm Muscles</text>

      <!-- Return Loop Arrow 4 back to Stimulus -->
      <path d="M 100 83 Q 50 83 50 50" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <polygon points="50,45 45,55 55,55" fill="#34d399"/>
    </g>
    

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Breathing rate accelerates during exercise to expel CO₂ and restore blood pH
      </text>
    </g>
  </g>
</svg>