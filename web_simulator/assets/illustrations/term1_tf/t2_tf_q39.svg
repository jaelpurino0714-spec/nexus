<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_tf_39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t2_tf_39" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_tf_39)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_t2_tf_39)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: ACIDS, BASES &amp; SALTS • Q39</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#ec4899"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">ACID-BASE</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#ec4899" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      NATURAL RAINWATER ACIDITY (pH ~5.6)
    </text>

    <!-- Specific Visual Elements -->
    
    <g transform="translate(0, 38)">
      <defs>
        <linearGradient id="ph_grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ef4444"/>
          <stop offset="25%" stop-color="#f97316"/>
          <stop offset="50%" stop-color="#22c55e"/>
          <stop offset="75%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
      </defs>
      <!-- Spectrum Bar -->
      <rect x="60" y="30" width="370" height="24" rx="8" fill="url(#ph_grad)" stroke="#1e293b" stroke-width="2"/>
      <!-- Scale Labels -->
      <text x="60" y="22" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="900">pH 1 (Acid)</text>
      <text x="245" y="22" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">pH 7 (Neutral)</text>
      <text x="430" y="22" fill="#8b5cf6" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="end">pH 14 (Base)</text>
      
      <!-- Pointer Needle -->
      <polygon points="200,60 216,60 208,52" fill="#fbbf24"/>
      <rect x="158" y="62" width="100" height="22" rx="6" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="208" y="77" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Rainwater (pH ~5.6)</text>
    </g>
    

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Clean rainwater has a mild natural acidity (pH ~5.6) due to dissolved atmospheric CO₂
      </text>
    </g>
  </g>
</svg>