<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tf_7_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_tf_7_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_tf_7_4)" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#84cc16" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#84cc16" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#84cc16" filter="url(#glow_tf_7_4)"/>
  <text x="50" y="32" fill="#84cc16" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 7: BIODIVERSITY &amp; ECOSYSTEMS • Q4</text>
  
  <rect x="365" y="15" width="145" height="24" rx="12" fill="#84cc16"/>
  <text x="437" y="31" fill="#080c18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">ECOSYSTEM DYNAMICS</text>

  <!-- Main Illustration Content -->
  
  <rect x="40" y="60" width="460" height="165" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#84cc16" stroke-width="1.2"/>
  <rect x="60" y="80" width="190" height="95" rx="10" fill="#1e1b4b" stroke="#4ade80" stroke-width="1"/>
  <text x="155" y="105" fill="#4ade80" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">BIOTIC FACTORS</text>
  <text x="155" y="128" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Plants &amp; Producers</text>
  <text x="155" y="146" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Herbivores &amp; Predators</text>
  <text x="155" y="164" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Decomposers &amp; Fungi</text>

  <rect x="290" y="80" width="190" height="95" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <text x="385" y="105" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ABIOTIC FACTORS</text>
  <text x="385" y="128" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Sunlight &amp; Temperature</text>
  <text x="385" y="146" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Water &amp; Moisture</text>
  <text x="385" y="164" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">• Soil &amp; Mineral Nutrients</text>

  <text x="270" y="202" fill="#a3e635" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Interacting Biotic Community &amp; Abiotic Physical Environment</text>
            
</svg>