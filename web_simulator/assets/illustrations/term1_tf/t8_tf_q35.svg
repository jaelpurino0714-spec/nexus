<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t8_tf_35" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t8_tf_35" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t8_tf_35)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#8b5cf6" filter="url(#glow_t8_tf_35)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 8: HEREDITY AND GENETICS • Q35</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#8b5cf6"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">GENETICS</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#a78bfa" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      GEL ELECTROPHORESIS MOLECULAR SEPARATION
    </text>

    <!-- Specific Visual Elements -->
    <g transform="translate(100, 32)">
           <rect x="20" y="15" width="240" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
           <line x1="50" y1="35" x2="50" y2="60" stroke="#38bdf8" stroke-width="4"/>
           <line x1="100" y1="35" x2="100" y2="60" stroke="#a78bfa" stroke-width="4"/>
           <line x1="160" y1="35" x2="160" y2="60" stroke="#f472b6" stroke-width="4"/>
           <text x="190" y="52" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="800">Size Migration</text>
         </g>

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Gel electrophoresis separates negatively charged DNA fragments by molecular base-pair size
      </text>
