<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t6_tf_27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t6_tf_27" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t6_tf_27)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#a855f7" filter="url(#glow_t6_tf_27)"/>
  <text x="50" y="32" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 6: EVOLUTION AND NATURAL SELECTION • Q27</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#a855f7"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EVOLUTION</text>

  <!-- Main Illustration Artwork Card -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#a855f7" stroke-width="2"/>
    
    <!-- Title -->
    <text x="245" y="24" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      CHRONOLOGY OF SPECIATION STAGES
    </text>

    <!-- Specific Visual Elements -->
    <g transform="translate(45, 36)">
           <rect x="10" y="15" width="85" height="45" rx="6" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
           <text x="52" y="42" fill="#c084fc" font-family="sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">Variation</text>

           <text x="107" y="44" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="900">→</text>

           <rect x="125" y="15" width="85" height="45" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
           <text x="167" y="42" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">Isolation</text>

           <text x="222" y="44" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="900">→</text>

           <rect x="240" y="15" width="85" height="45" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
           <text x="282" y="42" fill="#fbbf24" font-family="sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">Selection</text>

           <text x="337" y="44" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="900">→</text>

           <rect x="355" y="15" width="95" height="45" rx="6" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
           <text x="402" y="42" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">New Species</text>
         </g>

    <!-- Bottom Concept Callout -->
    <g transform="translate(25, 142)">
      <rect x="0" y="0" width="440" height="32" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.2"/>
      <text x="220" y="21" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">
        Speciation path: Genetic Variation → Isolation → Selection → Divergence into New Species
      </text>
    </g>
