<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h21" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h21)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h21)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 21</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h21)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REMEMBERING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Kidney Left -->
  <g transform="translate(100, 75)">
    <path d="M 40,10 C 10,10 0,40 0,70 C 0,100 20,120 50,120 C 80,120 90,95 85,70 C 80,45 70,10 40,10 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="40" y="70" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KIDNEY</text>
  </g>

  <!-- Blood Vessels &amp; Ureter -->
  <g transform="translate(180, 85)">
    <!-- Renal Artery (Inflow) -->
    <path d="M 0,25 L 80,25" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <text x="130" y="22" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">Renal Artery (Waste + Blood In)</text>

    <!-- Renal Vein (Filtered Blood Out) -->
    <path d="M 0,55 L 80,55" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <text x="130" y="52" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="bold">Renal Vein (Purified Blood Return)</text>

    <!-- Ureter (Urine Excretion) -->
    <path d="M -20,80 Q 20,110 60,110" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4,4"/>
    <text x="130" y="105" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">Ureter (Excess Water &amp; Urea Out)</text>
  </g>

  <rect x="70" y="215" width="400" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1"/>
  <text x="270" y="231" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Maintains Osmoregulation: Filters 180L fluid/day, adjusts urine volume</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Renal System: Kidneys Regulate Fluid Osmolarity &amp; Excrete Waste</text>
</svg>