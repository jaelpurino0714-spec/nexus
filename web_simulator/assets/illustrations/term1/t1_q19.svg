<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t1_19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t1_19" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow_t1_19" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t1_19)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#38bdf8" filter="url(#glow_t1_19)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL VS. CHEMICAL CHANGE • Q19</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t1_19)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
  <g transform="translate(80, 85)">
    <!-- Compound AB splitting into A + B -->
    <g transform="translate(20, 14)">
      <circle cx="0" cy="16" r="16" fill="#ec4899"/><text x="0" y="20" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">A</text>
      <circle cx="24" cy="16" r="16" fill="#8b5cf6"/><text x="24" y="20" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B</text>
    </g>

    <!-- Arrow with energy spark -->
    <line x1="85" y1="30" x2="135" y2="30" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="140,30 131,25 131,35" fill="#f59e0b"/>
    <text x="110" y="20" fill="#f59e0b" font-size="12" text-anchor="middle">⚡</text>

    <!-- Separated A + B -->
    <g transform="translate(170, 0)">
      <circle cx="15" cy="30" r="16" fill="#ec4899"/><text x="15" y="34" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">A</text>
      <text x="45" y="36" fill="#94a3b8" font-size="18" font-weight="bold" text-anchor="middle">+</text>
      <circle cx="75" cy="30" r="16" fill="#8b5cf6"/><text x="75" y="34" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B</text>
    </g>
  </g>

  <g transform="translate(345, 80)">
    <rect x="0" y="0" width="145" height="85" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.8"/>
    <text x="72" y="24" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DECOMPOSITION</text>
    <text x="72" y="44" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AB → A + B</text>
    <text x="72" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">1 reactant cleaves</text>
    <text x="72" y="77" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">into multiples</text>
  </g>

  </g>

  <!-- Bottom Educational Concept Bar -->
  <rect x="50" y="240" width="440" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="256" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Reaction Classification: Decomposition Splits Compound into Constituent Units</text>
</svg>