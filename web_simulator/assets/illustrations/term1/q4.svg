<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <linearGradient id="neon_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neon_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neon_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="neon_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bg_4)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="16" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="33" r="5" fill="#38bdf8" filter="url(#glow_4)"/>
  <text x="50" y="38" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">RATES OF CHEMICAL REACTIONS</text>
  <rect x="420" y="22" width="90" height="22" rx="11" fill="url(#neon_purple)"/>
  <text x="465" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Diagram Content Area -->
  <g transform="translate(0, 10)">
    
  <line x1="60" y1="210" x2="480" y2="210" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="210" x2="60" y2="65" stroke="#64748b" stroke-width="2"/>

  <!-- High Reactant Level -->
  <line x1="70" y1="120" x2="160" y2="120" stroke="#38bdf8" stroke-width="4"/>
  <text x="115" y="110" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Reactants (High PE)</text>

  <!-- Energy Peak -->
  <path d="M 160 120 Q 260 55, 330 180" fill="none" stroke="url(#neon_amber)" stroke-width="3.5"/>

  <!-- Low Product Level -->
  <line x1="330" y1="180" x2="440" y2="180" stroke="#34d399" stroke-width="4"/>
  <text x="385" y="172" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Products (Low PE)</text>

  <!-- Heat Released Arrow -->
  <line x1="280" y1="120" x2="280" y2="180" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow_down)"/>
  <path d="M 276 175 L 280 183 L 284 175 Z" fill="#ef4444"/>
  <text x="290" y="152" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="900">-ΔH (Heat Released)</text>

  <rect x="160" y="222" width="220" height="24" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
  <text x="270" y="238" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Exothermic: Releases Thermal Energy</text>

  </g>
</svg>