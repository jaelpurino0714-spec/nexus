<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <linearGradient id="neon_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neon_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neon_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="neon_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_15" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bg_15)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="16" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="33" r="5" fill="#38bdf8" filter="url(#glow_15)"/>
  <text x="50" y="38" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">RATES OF CHEMICAL REACTIONS</text>
  <rect x="420" y="22" width="90" height="22" rx="11" fill="url(#neon_purple)"/>
  <text x="465" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">ANALYZING</text>

  <!-- Diagram Content Area -->
  <g transform="translate(0, 10)">
    
  <!-- Solid Marble Chip Beaker -->
  <g transform="translate(70, 75)">
    <rect x="10" y="10" width="80" height="100" rx="6" fill="#1e1b4b" stroke="#64748b" stroke-width="2"/>
    <rect x="15" y="45" width="70" height="60" fill="#3b82f6" fill-opacity="0.3"/>
    <polygon points="35,80 65,80 55,60 40,65" fill="#cbd5e1" stroke="#94a3b8"/>
    <circle cx="50" cy="50" r="3" fill="#ffffff" fill-opacity="0.7"/>
    <text x="50" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Solid Marble Chip</text>
    <text x="50" y="145" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Slow Reaction</text>
  </g>

  <!-- VS Text -->
  <text x="220" y="130" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="900">VS</text>

  <!-- Powdered Calcium Carbonate Beaker -->
  <g transform="translate(290, 75)">
    <rect x="10" y="10" width="80" height="100" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="15" y="45" width="70" height="60" fill="#3b82f6" fill-opacity="0.4"/>
    <!-- powder dots -->
    <circle cx="30" cy="85" r="2" fill="#ffffff"/><circle cx="45" cy="85" r="2" fill="#ffffff"/><circle cx="60" cy="85" r="2" fill="#ffffff"/>
    <circle cx="35" cy="95" r="2" fill="#ffffff"/><circle cx="50" cy="95" r="2" fill="#ffffff"/><circle cx="65" cy="95" r="2" fill="#ffffff"/>
    <!-- vigorous bubbles -->
    <circle cx="30" cy="55" r="4" fill="#38bdf8"/><circle cx="45" cy="45" r="5" fill="#38bdf8"/><circle cx="60" cy="52" r="4" fill="#38bdf8"/>
    <circle cx="50" cy="30" r="3" fill="#38bdf8"/><circle cx="65" cy="35" r="4" fill="#38bdf8"/>
    <text x="50" y="130" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Powdered CaCO₃</text>
    <text x="50" y="145" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Vigorous Fizzing!</text>
  </g>

  <rect x="150" y="222" width="240" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <text x="270" y="238" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Responsible Variable: Surface Area</text>

  </g>
</svg>