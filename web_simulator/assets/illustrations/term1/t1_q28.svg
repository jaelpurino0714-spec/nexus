<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t1_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t1_28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t1_28)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#06b6d4" filter="url(#glow_t1_28)"/>
  <text x="50" y="32" fill="#06b6d4" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL &amp; CHEMICAL CHANGES • Q28</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#06b6d4"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EXPERIMENT</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(70, 48)">
      <rect x="0" y="0" width="400" height="185" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
      <text x="200" y="28" fill="#22d3ee" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">BOILING &amp; EVAPORATION (PHYSICAL CHANGE)</text>

      <g transform="translate(140, 45)">
        <!-- Beaker with Boiling Water -->
        <rect x="25" y="30" width="70" height="55" rx="6" fill="#0891b2" fill-opacity="0.8" stroke="#67e8f9" stroke-width="2"/>
        <circle cx="45" cy="55" r="4" fill="#ffffff" opacity="0.7"/>
        <circle cx="65" cy="45" r="5" fill="#ffffff" opacity="0.8"/>
        <circle cx="55" cy="70" r="3.5" fill="#ffffff" opacity="0.6"/>
        <!-- Rising Steam Waves -->
        <path d="M 40 25 Q 30 15 40 5 Q 50 -5 40 -15" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 60 25 Q 70 15 60 5 Q 50 -5 60 -15" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 80 25 Q 70 15 80 5 Q 90 -5 80 -15" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <g transform="translate(40, 135)">
        <rect x="0" y="0" width="320" height="38" rx="8" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.2"/>
        <text x="160" y="24" fill="#cffafe" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
          H₂O(l)  →  H₂O(g)  [Physical State Transition]
        </text>
      </g>
