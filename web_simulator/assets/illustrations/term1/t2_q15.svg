<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t2_15" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_15)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#38bdf8" filter="url(#glow_t2_15)"/>
  <text x="50" y="32" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 2: TYPES OF CHEMICAL REACTIONS • Q15</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#38bdf8"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">PLANT BIO</text>

  <!-- Main Illustration Artwork -->
  
    <defs>
      <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#047857"/>
        <stop offset="50%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#84cc16"/>
      </linearGradient>
      <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>

    <!-- Glowing Sun with light rays -->
    <g transform="translate(60, 48)">
      <circle cx="25" cy="25" r="18" fill="url(#sunGrad)" opacity="0.95"/>
      <line x1="45" y1="35" x2="160" y2="90" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.75"/>
      <line x1="38" y1="48" x2="150" y2="115" stroke="#fde047" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
      <line x1="50" y1="22" x2="175" y2="75" stroke="#fde047" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
      <text x="25" y="62" fill="#fde047" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">SUNLIGHT</text>
    </g>

    <!-- Green Leaf with Veins -->
    <g transform="translate(180, 42)">
      <ellipse cx="90" cy="180" rx="75" ry="12" fill="#000000" opacity="0.5"/>
      <!-- Stem -->
      <path d="M 20 175 Q 40 160 65 140" fill="none" stroke="#065f46" stroke-width="6" stroke-linecap="round"/>
      <!-- Leaf Blade -->
      <path d="M 45 160 C 20 110, 60 40, 165 30 C 170 85, 140 165, 45 160 Z" 
            fill="url(#leafGrad)" stroke="#6ee7b7" stroke-width="2"/>
      <!-- Midrib -->
      <path d="M 45 160 Q 105 105 165 30" fill="none" stroke="#dcfce7" stroke-width="3" stroke-linecap="round"/>
      <!-- Lateral Veins -->
      <g stroke="#dcfce7" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
        <path d="M 80 135 Q 70 115 65 105"/>
        <path d="M 95 120 Q 120 125 135 130"/>
        <path d="M 110 102 Q 95 82 85 75"/>
        <path d="M 125 85 Q 145 92 155 100"/>
        <path d="M 140 65 Q 130 50 120 45"/>
      </g>
      <!-- Dew drop -->
      <ellipse cx="120" cy="72" rx="4.5" ry="3.5" fill="#ffffff" opacity="0.75"/>
      <circle cx="121" cy="71" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Inflow / Outflow Badges -->
    <g transform="translate(65, 150)">
      <rect x="0" y="0" width="105" height="48" rx="8" fill="#1e1b4b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="52" y="20" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">INFLOW (REACTANTS)</text>
      <text x="52" y="38" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">CO₂ + H₂O</text>
      <path d="M 110 24 L 140 24 M 132 18 L 140 24 L 132 30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(370, 100)">
      <path d="M -35 24 L -5 24 M -13 18 L -5 24 L -13 30" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="0" width="115" height="52" rx="8" fill="#1e1b4b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
      <text x="57" y="20" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">OUTFLOW (PRODUCTS)</text>
      <text x="57" y="40" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">CO₂ + H₂O → [ ? ]</text>
    </g>
    
</svg>