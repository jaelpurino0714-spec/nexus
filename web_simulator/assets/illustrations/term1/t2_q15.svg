<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t2_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <filter id="glow_t2_15" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t2_15)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/>
    <line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/>
    <line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#10b981" filter="url(#glow_t2_15)"/>
  <text x="50" y="35" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 2: TYPES OF CHEMICAL REACTIONS • Q15</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="#a855f7"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">ANALYZING</text>

  <!-- Diagram Visual Body -->
  <g transform="translate(0, 10)">
    
          <g transform="translate(130, 85)">
            <rect x="0" y="0" width="65" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
            <text x="32" y="32" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">A</text>
            
            <text x="85" y="32" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">+</text>
            
            <rect x="105" y="0" width="65" height="50" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
            <text x="137" y="32" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">B</text>
            
            <text x="195" y="32" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">→</text>
            
            <rect x="225" y="0" width="85" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
            <text x="267" y="32" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AB</text>
          </g>
          <text x="270" y="170" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Synthesis • Decomposition • Single &amp; Double Displacement</text>
        
  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="238" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="254" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Concept: Reverse</text>
</svg>