<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t4_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t4_5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow_t4_5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t4_5)" stroke="#8b5cf6" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#8b5cf6" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#8b5cf6" filter="url(#glow_t4_5)"/>
  <text x="50" y="35" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 4: CHEMICAL EQUATIONS • Q5</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t4_5)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
        <g transform="translate(50, 75)">
          <rect x="0" y="10" width="100" height="90" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="50" y="32" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">(s)</text>
          <text x="50" y="55" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">SOLID</text>
          <text x="50" y="80" fill="#cbd5e1" font-size="8" text-anchor="middle">Rigid crystal</text>

          <rect x="110" y="10" width="100" height="90" rx="6" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5"/>
          <text x="160" y="32" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">(l)</text>
          <text x="160" y="55" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">LIQUID</text>
          <text x="160" y="80" fill="#cbd5e1" font-size="8" text-anchor="middle">Pure fluid (H₂O)</text>

          <rect x="220" y="10" width="100" height="90" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.5"/>
          <text x="270" y="32" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">(g)</text>
          <text x="270" y="55" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">GAS</text>
          <text x="270" y="80" fill="#cbd5e1" font-size="8" text-anchor="middle">Vapor phase</text>

          <rect x="330" y="10" width="100" height="90" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
          <text x="380" y="32" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">(aq)</text>
          <text x="380" y="55" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">AQUEOUS</text>
          <text x="380" y="80" fill="#cbd5e1" font-size="8" text-anchor="middle">In water solution</text>
        </g>
  </g>

  <!-- Bottom Educational Concept Bar -->
  <rect x="50" y="240" width="440" height="24" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="256" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Physical State Symbols: Solid (s), Liquid (l), Gas (g), Aqueous (aq)</text>
</svg>