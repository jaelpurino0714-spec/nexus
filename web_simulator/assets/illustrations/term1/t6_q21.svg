<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t6_21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t6_21" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t6_21)" stroke="#ec4899" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#ec4899" filter="url(#glow_t6_21)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 6: CHEMICAL REACTION RATES • Q21</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#ec4899"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">RUSTING</text>

  <!-- Main Illustration Artwork -->
  
    <defs>
      <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="50%" stop-color="#64748b"/>
        <stop offset="100%" stop-color="#334155"/>
      </linearGradient>
    </defs>
    <g transform="translate(160, 60)">
      <!-- Iron Nail with Rust Patches -->
      <path d="M 40 40 L 180 140 L 165 155 L 25 55 Z" fill="url(#ironGrad)" stroke="#475569" stroke-width="2"/>
      <rect x="15" y="45" width="28" height="18" rx="3" fill="#cbd5e1" transform="rotate(40 25 55)"/>
      <polygon points="180,140 210,165 165,155" fill="#475569"/>

      <!-- Orange Rust Oxidation Flakes -->
      <path d="M 75 75 Q 85 65 95 85 Q 110 80 120 100 Q 105 110 90 95 Z" fill="#d97706" opacity="0.9"/>
      <path d="M 125 105 Q 140 100 150 120 Q 135 130 120 115 Z" fill="#b45309" opacity="0.95"/>
      <circle cx="90" cy="80" r="3" fill="#f59e0b"/>
      <circle cx="135" cy="115" r="4" fill="#ea580c"/>

      <!-- Water droplets on metal -->
      <circle cx="65" cy="62" r="5" fill="#38bdf8" opacity="0.8"/>
      <circle cx="105" cy="90" r="4" fill="#38bdf8" opacity="0.8"/>
    </g>

    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="115" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="57" y="22" fill="#fcd34d" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OXIDATION</text>
      <text x="57" y="40" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">Fe + O₂ + H₂O</text>
    </g>

    <g transform="translate(380, 95)">
      <rect x="0" y="0" width="115" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="57" y="22" fill="#a5a3c4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CHANGE TYPE</text>
      <text x="57" y="40" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">[ ? ]</text>
    </g>
    
</svg>