<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t7_9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t7_9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t7_9)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#10b981" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#10b981" filter="url(#glow_t7_9)"/>
  <text x="50" y="32" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS AND REGULATION • Q9</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#10b981"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">HOMEOSTASIS</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="420" height="185" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="210" y="28" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">THERMOREGULATION (BODY TEMPERATURE)</text>

      <!-- Center Glass Thermometer -->
      <g transform="translate(195, 42)">
        <rect x="10" y="5" width="16" height="75" rx="8" fill="#1e1b4b" stroke="#ffffff" stroke-width="2"/>
        <circle cx="18" cy="85" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
        <rect x="14" y="25" width="8" height="60" fill="#ef4444"/>
      </g>

      <!-- Sweating Cooling Response -->
      <g transform="translate(30, 48)">
        <rect x="0" y="0" width="140" height="75" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="70" y="25" fill="#38bdf8" font-size="12" font-weight="900" text-anchor="middle">TOO HOT (&gt;37°C)</text>
        <text x="70" y="46" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">• Sweating</text>
        <text x="70" y="64" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">• Vasodilation</text>
      </g>

      <!-- Shivering Warming Response -->
      <g transform="translate(250, 48)">
        <rect x="0" y="0" width="140" height="75" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="70" y="25" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">TOO COLD (&lt;37°C)</text>
        <text x="70" y="46" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">• Shivering</text>
        <text x="70" y="64" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">• Vasoconstriction</text>
      </g>

      <rect x="110" y="145" width="200" height="28" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="1.2"/>
      <text x="210" y="164" fill="#34d399" font-size="13" font-weight="900" text-anchor="middle">Normal Setpoint: 37°C (98.6°F)</text>
    </g>
    
</svg>