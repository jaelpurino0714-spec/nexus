    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#6366f1" filter="url(#glow_t2_18)"/>
  <text x="50" y="32" fill="#6366f1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 2: TYPES OF CHEMICAL REACTIONS • Q18</text>
  
  <rect x="390" y="17" width="120" height="22" rx="11" fill="#6366f1"/>
  <text x="450" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION TYPE</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(35, 55)">
      <rect x="0" y="0" width="470" height="135" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.8"/>

      <rect x="30" y="15" width="160" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
      <text x="110" y="31" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">REACTANTS (BEFORE)</text>

      <rect x="280" y="15" width="160" height="24" rx="6" fill="#1e1b4b" stroke="#34d399" stroke-width="1"/>
      <text x="360" y="31" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PRODUCTS (AFTER)</text>

      <rect x="20" y="48" width="430" height="48" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="235" y="80" fill="#ffffff" font-family="'Consolas', 'Courier New', monospace" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        Reactants  →  Products
      </text>

      <g transform="translate(30, 105)">
        <text x="0" y="18" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Atomic rearrangement into new substances</text>
        <rect x="300" y="2" width="110" height="22" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
        <text x="355" y="17" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">[ ? ]</text>
