<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t2_23" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_23)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#6366f1" filter="url(#glow_t2_23)"/>
  <text x="50" y="32" fill="#6366f1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: TYPES OF CHEMICAL REACTIONS • Q23</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#6366f1"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION TYPE</text>

  <!-- Main Illustration Artwork -->
  
    <defs>
      <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#b91c1c"/>
        <stop offset="60%" stop-color="#ea580c"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
      <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#fde047"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
    </defs>

    <g transform="translate(195, 45)">
      <!-- Flame Base / Logs -->
      <rect x="25" y="140" width="100" height="18" rx="6" fill="#78350f" stroke="#451a03" stroke-width="2"/>
      <rect x="35" y="125" width="80" height="18" rx="6" fill="#92400e" stroke="#451a03" stroke-width="2" transform="rotate(-8 75 135)"/>

      <!-- Outer Flame -->
      <path d="M 75 15 C 115 55, 140 95, 125 135 C 110 145, 40 145, 25 135 C 10 95, 35 55, 75 15 Z" fill="url(#flameOuter)" opacity="0.95"/>
      <!-- Inner Flame -->
      <path d="M 75 55 C 95 80, 110 110, 100 135 C 90 140, 60 140, 50 135 C 40 110, 55 80, 75 55 Z" fill="url(#flameInner)"/>
    </g>

    <!-- Bottom Energy Pill -->
    <g transform="translate(80, 192)">
      <rect x="0" y="0" width="380" height="38" rx="10" fill="#1e1b4b" fill-opacity="0.95" stroke="#f97316" stroke-width="1.8"/>
      <text x="190" y="24" fill="#fed7aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        Fuel  +  O₂  →  CO₂  +  H₂O  +  HEAT (ΔH &lt; 0)
      </text>
    </g>
    
</svg>