<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t7_40" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t7_40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t7_40)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#10b981" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#10b981" filter="url(#glow_t7_40)"/>
  <text x="50" y="32" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS AND REGULATION • Q40</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#10b981"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">HOMEOSTASIS</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="2"/>
      
      <!-- Top Title -->
      <text x="245" y="24" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        NEGATIVE FEEDBACK CONTROL LOOP
      </text>

      <!-- 1. STIMULUS -->
      <g transform="translate(25, 38)">
        <rect x="0" y="0" width="135" height="44" rx="8" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.8"/>
        <text x="67" y="27" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">1. STIMULUS</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <g stroke="#f472b6" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="165" y1="60" x2="205" y2="60"/>
        <polygon points="208,60 198,54 198,66" fill="#f472b6"/>
      </g>

      <!-- 2. RECEPTOR -->
      <g transform="translate(215, 38)">
        <rect x="0" y="0" width="135" height="44" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.8"/>
        <text x="67" y="27" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">2. RECEPTOR</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <g stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M 355 60 Q 410 60 410 100"/>
        <polygon points="410,103 404,93 416,93" fill="#38bdf8"/>
      </g>

      <!-- 3. CONTROL CENTER -->
      <g transform="translate(305, 110)">
        <rect x="0" y="0" width="165" height="44" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.8"/>
        <text x="82" y="27" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">3. CONTROL CENTER</text>
      </g>

      <!-- Arrow 3 -> 4 -->
      <g stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="300" y1="132" x2="255" y2="132"/>
        <polygon points="250,132 260,126 260,138" fill="#fbbf24"/>
      </g>

      <!-- 4. EFFECTOR -->
      <g transform="translate(95, 110)">
        <rect x="0" y="0" width="145" height="44" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.8"/>
        <text x="72" y="27" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">4. EFFECTOR</text>
      </g>

      <!-- Arrow 4 back to Stimulus (Feedback return) -->
      <g stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M 90 132 Q 40 132 40 90"/>
        <polygon points="40,85 34,95 46,95" fill="#34d399"/>
      </g>

      <!-- Center Setpoint Goal Badge -->
      <rect x="130" y="160" width="230" height="20" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="245" y="174" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">
        Maintains Internal Stable Setpoint
      </text>
    </g>
    
</svg>