<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h40" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h40" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h40" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h40" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h40" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h40" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h40)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h40)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 40</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h40)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Neural Track -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="195" height="110" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="97" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NERVOUS SYSTEM</text>
    <!-- Axon Fiber with Action Potential -->
    <line x1="25" y1="48" x2="170" y2="48" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="48" r="6" fill="#fbbf24" filter="url(#glow_h40)"/>
    <text x="97" y="70" fill="#bae6fd" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">⚡ Milliseconds (Action Potentials)</text>
    <text x="97" y="85" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Direct synaptic wiring to targets</text>
    <text x="97" y="98" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Immediate, localized corrective reflex</text>
  </g>

  <!-- Endocrine Track -->
  <g transform="translate(285, 75)">
    <rect x="0" y="0" width="195" height="110" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.8"/>
    <text x="97" y="22" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ENDOCRINE SYSTEM</text>
    <!-- Blood vessel with hormone droplets -->
    <rect x="25" y="42" width="145" height="12" rx="6" fill="#7f1d1d"/>
    <circle cx="55" cy="48" r="4" fill="#fbbf24"/>
    <circle cx="95" cy="48" r="4" fill="#fbbf24"/>
    <circle cx="135" cy="48" r="4" fill="#fbbf24"/>
    <text x="97" y="70" fill="#e9d5ff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🩸 Minutes to Days (Hormones)</text>
    <text x="97" y="85" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Vascular broadcast to all receptors</text>
    <text x="97" y="98" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Long-term, systemic equilibrium</text>
  </g>

  <text x="270" y="220" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Collaborative synergy: Neural reflex provides rapid rescue; Endocrine maintains stability</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Dual Regulatory Axes: Fast Neural Wiring vs Sustained Hormonal Flow</text>
</svg>