<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t2_21" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_21)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#6366f1" filter="url(#glow_t2_21)"/>
  <text x="50" y="32" fill="#6366f1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: TYPES OF CHEMICAL REACTIONS • Q21</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#6366f1"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION TYPE</text>

  <!-- Main Illustration Artwork -->
  
    <defs>
      <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#047857"/>
        <stop offset="50%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#84cc16"/>
      </linearGradient>
      <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>

    <!-- Glowing Sun with light rays -->
    <g transform="translate(35, 52)">
      <circle cx="35" cy="35" r="24" fill="url(#sunGrad)" stroke="#fde047" stroke-width="2"/>
      <line x1="60" y1="48" x2="180" y2="100" stroke="#fde047" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>
      <line x1="50" y1="62" x2="170" y2="125" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.75"/>
      <line x1="65" y1="32" x2="200" y2="85" stroke="#fde047" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.75"/>
      <rect x="0" y="70" width="70" height="24" rx="6" fill="#1e1b4b" stroke="#fde047" stroke-width="1"/>
      <text x="35" y="86" fill="#fde047" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">SUNLIGHT</text>
    </g>

    <!-- Green Leaf with Veins -->
    <g transform="translate(195, 45)">
      <ellipse cx="90" cy="180" rx="75" ry="12" fill="#000000" opacity="0.5"/>
      <path d="M 20 175 Q 40 160 65 140" fill="none" stroke="#065f46" stroke-width="7" stroke-linecap="round"/>
      <path d="M 45 160 C 20 110, 60 40, 165 30 C 170 85, 140 165, 45 160 Z" 
            fill="url(#leafGrad)" stroke="#6ee7b7" stroke-width="2.5"/>
      <path d="M 45 160 Q 105 105 165 30" fill="none" stroke="#dcfce7" stroke-width="3.5" stroke-linecap="round"/>
      <g stroke="#dcfce7" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <path d="M 80 135 Q 70 115 65 105"/>
        <path d="M 95 120 Q 120 125 135 130"/>
        <path d="M 110 102 Q 95 82 85 75"/>
        <path d="M 125 85 Q 145 92 155 100"/>
      </g>
    </g>

    <!-- Bottom Botanical Formula Banner -->
    <g transform="translate(70, 192)">
      <rect x="0" y="0" width="400" height="38" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="1.8"/>
      <text x="200" y="24" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        CO₂ + H₂O  +  Light Energy  →  [ ? ]  +  O₂
      </text>
    </g>
    
</svg>