<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t7_34" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t7_34" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t7_34)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#10b981" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#10b981" filter="url(#glow_t7_34)"/>
  <text x="50" y="32" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS AND REGULATION • Q34</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#10b981"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">HOMEOSTASIS</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(45, 48)">
      <rect x="0" y="0" width="450" height="185" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="225" y="28" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">BLOOD GLUCOSE HOMEOSTASIS (PANCREAS)</text>

      <!-- High Blood Glucose -> Insulin -->
      <g transform="translate(30, 45)">
        <rect x="0" y="0" width="180" height="85" rx="10" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="90" y="24" fill="#fb7185" font-size="12" font-weight="900" text-anchor="middle">HIGH BLOOD SUGAR</text>
        <rect x="15" y="34" width="150" height="24" rx="4" fill="#881337"/>
        <text x="90" y="50" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">INSULIN RELEASED</text>
        <text x="90" y="74" fill="#e2e8f0" font-size="10.5" font-weight="bold" text-anchor="middle">Glucose → Stored Glycogen</text>
      </g>

      <!-- Low Blood Glucose -> Glucagon -->
      <g transform="translate(240, 45)">
        <rect x="0" y="0" width="180" height="85" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="90" y="24" fill="#38bdf8" font-size="12" font-weight="900" text-anchor="middle">LOW BLOOD SUGAR</text>
        <rect x="15" y="34" width="150" height="24" rx="4" fill="#0369a1"/>
        <text x="90" y="50" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">GLUCAGON RELEASED</text>
        <text x="90" y="74" fill="#e2e8f0" font-size="10.5" font-weight="bold" text-anchor="middle">Glycogen → Blood Glucose</text>
      </g>

      <rect x="65" y="145" width="320" height="26" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
      <text x="225" y="163" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">Maintains 70–110 mg/dL Fasting Blood Glucose</text>
    </g>
    
</svg>