<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t8_40" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t8_40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t8_40)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#a855f7" filter="url(#glow_t8_40)"/>
  <text x="50" y="32" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 8: EVOLUTION AND BIODIVERSITY • Q40</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#a855f7"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EVOLUTION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="420" height="185" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <text x="210" y="26" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">FOSSIL RECORD IN ROCK STRATA (LAW OF SUPERPOSITION)</text>

      <g transform="translate(60, 38)">
        <!-- Layer 1: Youngest -->
        <rect x="0" y="0" width="300" height="34" fill="#78716c" stroke="#44403c" stroke-width="1.5"/>
        <text x="15" y="22" fill="#f5f5f4" font-size="12" font-weight="900">UPPER STRATA (YOUNGEST)</text>
        <text x="280" y="22" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">Recent Mammals</text>

        <!-- Layer 2: Middle -->
        <rect x="0" y="34" width="300" height="34" fill="#57534e" stroke="#44403c" stroke-width="1.5"/>
        <text x="15" y="56" fill="#f5f5f4" font-size="12" font-weight="900">MIDDLE STRATA</text>
        <text x="280" y="56" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="end">Reptiles &amp; Birds</text>

        <!-- Layer 3: Oldest -->
        <rect x="0" y="68" width="300" height="38" fill="#44403c" stroke="#292524" stroke-width="1.5"/>
        <text x="15" y="92" fill="#f5f5f4" font-size="12" font-weight="900">DEEPEST STRATA (OLDEST)</text>
        <text x="280" y="92" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="end">Trilobites &amp; Fish</text>
      </g>

      <rect x="50" y="150" width="320" height="24" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
      <text x="210" y="167" fill="#e9d5ff" font-size="11.5" font-weight="bold" text-anchor="middle">Deeper Rock Layers Contain Older Ancestral Forms</text>
    </g>
    
</svg>