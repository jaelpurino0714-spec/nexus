<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <linearGradient id="neon_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neon_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neon_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="neon_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_13" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bg_13)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="16" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="33" r="5" fill="#38bdf8" filter="url(#glow_13)"/>
  <text x="50" y="38" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">RATES OF CHEMICAL REACTIONS</text>
  <rect x="420" y="22" width="90" height="22" rx="11" fill="url(#neon_purple)"/>
  <text x="465" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">EVALUATING</text>

  <!-- Diagram Content Area -->
  <g transform="translate(0, 10)">
    
  <!-- Mortar & Pestle Visual -->
  <g transform="translate(90, 80)">
    <path d="M 10 70 Q 50 110, 90 70 L 80 40 L 20 40 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="20" x2="50" y2="70" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <text x="50" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Mortar &amp; Pestle</text>
  </g>

  <!-- Rate Gauge -->
  <g transform="translate(290, 75)">
    <path d="M 30 110 A 70 70 0 0 1 170 110" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <path d="M 30 110 A 70 70 0 0 1 140 55" fill="none" stroke="url(#neon_green)" stroke-width="14" stroke-linecap="round" filter="url(#glow_13)"/>
    <circle cx="100" cy="110" r="8" fill="#ffffff"/>
    <line x1="100" y1="110" x2="140" y2="60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="100" y="135" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle">SPEED INCREASES</text>
  </g>

  <rect x="130" y="222" width="280" height="24" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="270" y="238" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Kinetic Result: Increases the Reaction Rate</text>

  </g>
</svg>