<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t1_16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t1_16" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t1_16)" stroke="#f97316" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#f97316" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#f97316" filter="url(#glow_t1_16)"/>
  <text x="50" y="32" fill="#f97316" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL &amp; CHEMICAL CHANGES • Q16</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#f97316"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">GENETICS</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(190, 48)">
      <!-- DNA strands -->
      <path d="M 30 20 Q 80 50 30 80 Q -20 110 30 140 Q 80 170 30 190" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <path d="M 130 20 Q 80 50 130 80 Q 180 110 130 140 Q 80 170 130 190" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>

      <!-- Base pair rungs -->
      <line x1="32" y1="35" x2="128" y2="35" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="45" y1="60" x2="115" y2="60" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="30" y1="80" x2="130" y2="80" stroke="#fcd34d" stroke-width="3"/>
      <line x1="45" y1="100" x2="115" y2="100" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="32" y1="125" x2="128" y2="125" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="30" y1="140" x2="130" y2="140" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="45" y1="165" x2="115" y2="165" stroke="#a78bfa" stroke-width="2.5"/>

      <!-- Glowing mutation marker -->
      <circle cx="80" cy="80" r="7" fill="#fbbf24"/>
    </g>

    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5"/>
      <text x="62" y="22" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">GENETIC MOLECULE</text>
      <text x="62" y="40" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">DNA &amp; Variation</text>
    </g>

    <g transform="translate(370, 95)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5"/>
      <text x="62" y="22" fill="#a5a3c4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">INHERITED TRAIT</text>
      <text x="62" y="40" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">[ ? ]</text>
    </g>
    
</svg>