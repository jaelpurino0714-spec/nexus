<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h22" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h22" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h22" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h22" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h22" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h22" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h22)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h22)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 22</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h22)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Vasodilation Box -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.8"/>
    <text x="85" y="25" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. VASODILATION</text>
    <!-- Wide Capillary -->
    <rect x="25" y="40" width="120" height="26" rx="13" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="85" y="57" fill="#fecaca" font-family="sans-serif" font-size="9" text-anchor="middle">Dilated Dermal Vessel</text>
    <!-- Radiant Heat Waves -->
    <path d="M 50,75 Q 60,85 50,95 M 85,75 Q 95,85 85,95 M 120,75 Q 130,85 120,95" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="85" y="110" fill="#fde68a" font-family="sans-serif" font-size="9" text-anchor="middle">Heat Radiates to Air</text>
  </g>

  <!-- Sweating Box -->
  <g transform="translate(290, 75)">
    <rect x="0" y="0" width="170" height="120" rx="10" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.8"/>
    <text x="85" y="25" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. SWEATING</text>
    <!-- Sweat Droplets -->
    <circle cx="55" cy="55" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="85" cy="50" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="115" cy="55" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Vapor arrows -->
    <path d="M 85,72 L 85,92 M 80,87 L 85,92 L 90,87" fill="none" stroke="#a5f3fc" stroke-width="2"/>
    <text x="85" y="110" fill="#bae6fd" font-family="sans-serif" font-size="9" text-anchor="middle">Evaporative Cooling</text>
  </g>

  <text x="270" y="222" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Net Outcome: Excess Body Core Heat Transferred to Environment (Cooling)</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Thermal Heat Dissipation: Sweating + Cutaneous Vasodilation</text>
</svg>