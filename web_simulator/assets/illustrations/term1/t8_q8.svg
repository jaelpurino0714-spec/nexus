  <text x="50" y="32" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 8: EVOLUTION AND BIODIVERSITY • Q8</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#a855f7"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EVOLUTION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(45, 48)">
      <rect x="0" y="0" width="450" height="185" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <text x="225" y="26" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="900" text-anchor="middle">HOMOLOGOUS STRUCTURES (COMMON ANCESTRY)</text>

      <g transform="translate(30, 40)">
