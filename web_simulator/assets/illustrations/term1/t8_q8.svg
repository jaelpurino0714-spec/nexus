      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t8_8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t8_8)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>

