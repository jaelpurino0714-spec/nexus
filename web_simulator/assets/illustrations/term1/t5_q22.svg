<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t5_22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t5_22" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t5_22)" stroke="#8b5cf6" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#8b5cf6" filter="url(#glow_t5_22)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 5: BALANCING CHEMICAL EQUATIONS • Q22</text>
  
  <rect x="390" y="17" width="120" height="22" rx="11" fill="#8b5cf6"/>
  <text x="450" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(60, 55)">
      <rect x="0" y="0" width="420" height="130" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.8"/>
      
      <!-- Formula Display -->
      <rect x="60" y="20" width="300" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <text x="210" y="58" fill="#ffffff" font-family="'Consolas', 'Courier New', monospace" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="2">
        H₂O vs H₂O₂
      </text>

      <!-- Focus Pointer / Callout -->
      <g transform="translate(135, 82)">
        <polygon points="75,0 70,12 80,12" fill="#fbbf24"/>
        <rect x="0" y="12" width="150" height="28" rx="6" fill="#312e81" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="75" y="30" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">SUBSCRIPT</text>
      </g>
      <text x="210" y="122" fill="#a5a3c4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Altering subscript changes compound identity</text>
    </g>
    
</svg>