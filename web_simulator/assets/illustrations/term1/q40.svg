<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_40" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <linearGradient id="neon_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neon_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neon_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="neon_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bg_40)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="16" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="33" r="5" fill="#38bdf8" filter="url(#glow_40)"/>
  <text x="50" y="38" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">RATES OF CHEMICAL REACTIONS</text>
  <rect x="420" y="22" width="90" height="22" rx="11" fill="url(#neon_purple)"/>
  <text x="465" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">CREATING</text>

  <!-- Diagram Content Area -->
  <g transform="translate(0, 10)">
    
  <!-- Single Liquid Solution Beaker -->
  <g transform="translate(190, 65)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" filter="url(#glow_40)"/>
    <rect x="5" y="40" width="150" height="75" fill="#38bdf8" fill-opacity="0.3"/>
    
    <!-- Dissolved Reactants & Catalyst particles thoroughly mixed -->
    <circle cx="35" cy="65" r="6" fill="#38bdf8"/><text x="35" y="69" fill="#090a1a" font-size="8" font-weight="bold" text-anchor="middle">R</text>
    <circle cx="115" cy="70" r="6" fill="#38bdf8"/><text x="115" y="74" fill="#090a1a" font-size="8" font-weight="bold" text-anchor="middle">R</text>
    <circle cx="75" cy="85" r="7" fill="#a855f7"/><text x="75" y="89" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Cat</text>
    <circle cx="130" cy="98" r="6" fill="#38bdf8"/><text x="130" y="102" fill="#090a1a" font-size="8" font-weight="bold" text-anchor="middle">R</text>
    <circle cx="45" cy="100" r="7" fill="#a855f7"/><text x="45" y="104" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Cat</text>

    <text x="80" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Aqueous Liquid Phase</text>
  </g>

  <text x="100" y="125" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Liquid Reactants</text>
  <text x="430" y="125" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Liquid Catalyst</text>

  <rect x="130" y="222" width="280" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <text x="270" y="238" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Classification: Homogeneous Catalysis</text>

  </g>
</svg>