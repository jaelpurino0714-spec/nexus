<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h38" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h38" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h38" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h38" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h38" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h38" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h38" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h38)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h38)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 38</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h38)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Vector comparison graphic -->
  <g transform="translate(80, 75)">
    <!-- Baseline Set Point -->
    <line x1="20" y1="60" x2="360" y2="60" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="365" y="64" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">Baseline Set Point</text>

    <!-- Initial Stimulus Vector UP (+ deviation) -->
    <g transform="translate(60, 20)">
      <path d="M 40,40 L 40,0" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="40,-5 34,5 46,5" fill="#ef4444"/>
      <text x="40" y="-12" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ STIMULUS</text>
      <text x="40" y="55" fill="#fca5a5" font-family="sans-serif" font-size="8.5" text-anchor="middle">Upward Deviation</text>
    </g>

    <!-- Negative Feedback Vector DOWN (- correction) -->
    <g transform="translate(220, 20)">
      <path d="M 40,0 L 40,40" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="40,45 34,35 46,35" fill="#06b6d4"/>
      <text x="40" y="-12" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">- NEGATIVE FEEDBACK</text>
      <text x="40" y="55" fill="#bae6fd" font-family="sans-serif" font-size="8.5" text-anchor="middle">Opposing Correction</text>
    </g>
  </g>

  <rect x="70" y="195" width="400" height="30" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <text x="270" y="210" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">"Negative" means NEGATING or REVERSING the original direction of change</text>
  <text x="270" y="222" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">(If stimulus was (+), response is (-); bringing variable back to baseline)</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Directional Vector Logic: Why Negative Feedback is Termed 'Negative'</text>
</svg>