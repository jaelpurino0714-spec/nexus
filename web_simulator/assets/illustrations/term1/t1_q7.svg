  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#38bdf8" filter="url(#glow_t1_7)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL VS. CHEMICAL CHANGE • Q7</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t1_7)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
  <!-- Reaction container glowing warm -->
  <g transform="translate(120, 75)">
    <rect x="0" y="15" width="90" height="95" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <!-- Heat waves radiating -->
    <path d="M -15,40 Q -5,50 -15,60 M -15,70 Q -5,80 -15,90" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 105,40 Q 95,50 105,60 M 105,70 Q 95,80 105,90" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <text x="45" y="60" fill="#fef08a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔥 HOT</text>
    <text x="45" y="80" fill="#fca5a5" font-family="sans-serif" font-size="9" text-anchor="middle">Exothermic ΔH &lt; 0</text>
  </g>

  <g transform="translate(245, 85)">
    <rect x="0" y="0" width="220" height="75" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="110" y="24" fill="#fbbf24" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">EVIDENCE: Temperature Rise</text>
    <text x="110" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">CaO (Quicklime) + H₂O</text>
    <text x="110" y="62" fill="#ef4444" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">→ Ca(OH)₂ (Slaked Lime) + Thermal Heat</text>
  </g>

  </g>

  <!-- Bottom Educational Concept Bar -->
