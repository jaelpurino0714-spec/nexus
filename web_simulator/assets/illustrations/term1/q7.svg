<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <linearGradient id="neon_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neon_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neon_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="neon_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bg_7)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="16" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="33" r="5" fill="#38bdf8" filter="url(#glow_7)"/>
  <text x="50" y="38" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">RATES OF CHEMICAL REACTIONS</text>
  <rect x="420" y="22" width="90" height="22" rx="11" fill="url(#neon_purple)"/>
  <text x="465" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">ANALYZING</text>

  <!-- Diagram Content Area -->
  <g transform="translate(0, 10)">
    
  <!-- Triangle Outline -->
  <polygon points="270,75 140,205 400,205" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="2,2"/>
  
  <!-- Left Side: Fuel -->
  <line x1="270" y1="75" x2="140" y2="205" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="180" y="130" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="900" transform="rotate(-45 180,130)">FUEL</text>

  <!-- Right Side: Heat -->
  <line x1="270" y1="75" x2="400" y2="205" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <text x="350" y="130" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="900" transform="rotate(45 350,130)">HEAT</text>

  <!-- Bottom Side: Oxygen -->
  <line x1="140" y1="205" x2="400" y2="205" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <text x="270" y="222" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">OXYGEN (O₂)</text>

  <!-- Flame in Center -->
  <circle cx="270" cy="155" r="24" fill="#f59e0b" fill-opacity="0.3" filter="url(#glow_7)"/>
  <text x="270" y="165" font-size="30" text-anchor="middle">🔥</text>

  <!-- Badge -->
  <rect x="170" y="235" width="200" height="22" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1"/>
  <text x="270" y="250" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Combustion Triad: Fire Triangle</text>

  </g>
</svg>