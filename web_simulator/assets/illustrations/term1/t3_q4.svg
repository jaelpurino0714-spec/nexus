<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t3_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <filter id="glow_t3_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t3_4)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.06" stroke="#ec4899" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/>
    <line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/>
    <line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#ec4899" filter="url(#glow_t3_4)"/>
  <text x="50" y="35" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 3: ACIDS, BASES, AND SALTS • Q4</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="#38bdf8"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REMEMBERING</text>

  <!-- Diagram Visual Body -->
  <g transform="translate(0, 10)">
    
          <!-- pH Scale Gradient Bar -->
          <g transform="translate(90, 85)">
            <defs>
              <linearGradient id="phGrad_4" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ef4444"/>
                <stop offset="35%" stop-color="#f59e0b"/>
                <stop offset="50%" stop-color="#10b981"/>
                <stop offset="65%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect x="0" y="20" width="360" height="24" rx="12" fill="url(#phGrad_4)"/>
            <!-- Markers -->
            <text x="15" y="15" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">0 (Acidic, H⁺)</text>
            <text x="180" y="15" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">7 (Neutral)</text>
            <text x="345" y="15" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">14 (Basic, OH⁻)</text>
            
            <circle cx="180" cy="32" r="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
          </g>
          <text x="270" y="165" fill="#ec4899" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Litmus Test • Neutralization (Acid + Base → Salt + Water)</text>
        
  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="238" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="254" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Concept: Pink Base</text>
</svg>