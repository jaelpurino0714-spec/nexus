<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h24" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h24" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h24" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h24" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h24" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h24" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h24)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h24)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 24</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h24)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REMEMBERING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Phospholipid Bilayer Membrane -->
  <g transform="translate(70, 75)">
    <rect x="0" y="45" width="400" height="18" fill="#334155" rx="3"/>
    <text x="20" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Extracellular Fluid [High Na⁺]</text>
    <text x="20" y="80" fill="#94a3b8" font-family="sans-serif" font-size="9">Cytoplasm [High K⁺]</text>

    <!-- Sodium-Potassium ATPase Pump -->
    <rect x="170" y="25" width="60" height="58" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="2.5"/>
    <text x="200" y="52" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Na⁺/K⁺</text>
    <text x="200" y="65" fill="#a7f3d0" font-family="sans-serif" font-size="8" text-anchor="middle">ATPase</text>

    <!-- ATP Hydrolysis Spark -->
    <g transform="translate(245, 65)">
      <polygon points="15,0 35,0 45,15 35,30 15,30 5,15" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="25" y="19" fill="#000" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ATP</text>
      <path d="M 45,20 L 75,20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2,2"/>
      <text x="105" y="23" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">ADP + Energy</text>
    </g>

    <!-- Ion Arrows -->
    <path d="M 180,25 L 180,5 M 175,10 L 180,5 L 185,10" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="180" y="0" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">3 Na⁺ OUT</text>

    <path d="M 215,85 L 215,105 M 210,100 L 215,105 L 220,100" stroke="#a855f7" stroke-width="2" fill="none"/>
    <text x="215" y="118" fill="#c084fc" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">2 K⁺ IN</text>
  </g>

  <text x="270" y="225" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Homeostatic gradients CANNOT persist without continuous ATP expenditure</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cellular Energetics: ATP Powers Active Homeostatic Transport</text>
</svg>