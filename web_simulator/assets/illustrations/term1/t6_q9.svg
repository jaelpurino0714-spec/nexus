<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t6_9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <filter id="glow_t6_9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t6_9)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.06" stroke="#ef4444" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/>
    <line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/>
    <line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#ef4444" filter="url(#glow_t6_9)"/>
  <text x="50" y="35" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 6: RATES OF CHEMICAL REACTIONS • Q9</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="#f59e0b"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REMEMBERING</text>

  <!-- Diagram Visual Body -->
  <g transform="translate(0, 10)">
    
          <line x1="90" y1="180" x2="450" y2="180" stroke="#64748b" stroke-width="2"/>
          <line x1="90" y1="180" x2="90" y2="75" stroke="#64748b" stroke-width="2"/>
          <path d="M 100 150 Q 230 55, 340 140 T 440 160" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
          <path d="M 100 150 Q 230 95, 340 140 T 440 160" fill="none" stroke="#10b981" stroke-width="3.5"/>
          <text x="230" y="75" fill="#f87171" font-family="sans-serif" font-size="10">Uncatalyzed Ea</text>
          <text x="230" y="115" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">Catalyzed (Lower Ea)</text>
          <text x="270" y="200" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Temperature • Surface Area • Concentration • Catalyst</text>
        
  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="238" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="254" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Concept: Inhibitor</text>
</svg>