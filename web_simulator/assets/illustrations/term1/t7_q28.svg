<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h28)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h28)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 28</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h28)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Circular amplifying cycle -->
  <g transform="translate(70, 70)">
    <!-- Stage 1 -->
    <rect x="0" y="20" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="37" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Baby Stretches Cervix</text>
    <text x="65" y="50" fill="#fde68a" font-family="sans-serif" font-size="8" text-anchor="middle">Nerve impulses to brain</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 135,40 L 165,40" stroke="#fbbf24" stroke-width="2"/>

    <!-- Stage 2 -->
    <rect x="170" y="20" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="235" y="37" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pituitary Releases</text>
    <text x="235" y="50" fill="#e9d5ff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OXYTOCIN</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 305,40 L 335,40" stroke="#a855f7" stroke-width="2"/>

    <!-- Stage 3 -->
    <rect x="340" y="20" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="405" y="37" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Uterine Contractions</text>
    <text x="405" y="50" fill="#fca5a5" font-family="sans-serif" font-size="8" text-anchor="middle">Strengthen &amp; Increase</text>

    <!-- Return Loop (More Stretch) -->
    <path d="M 405,65 C 405,115 65,115 65,65" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
    <polygon points="65,63 60,70 70,70" fill="#ef4444"/>
    <text x="235" y="110" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">POSITIVE FEEDBACK: Loop intensifies until birth occurs</text>
  </g>

  <text x="270" y="225" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Climax event (delivery of child) terminates the self-amplifying cascade</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Positive Feedback in Parturition: Oxytocin Amplification Loop</text>
</svg>