<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t1_21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t1_21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow_t1_21" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t1_21)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#38bdf8" filter="url(#glow_t1_21)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL VS. CHEMICAL CHANGE • Q21</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t1_21)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
  <g transform="translate(80, 85)">
    <!-- Free element replacing partner -->
    <circle cx="25" cy="30" r="16" fill="#f59e0b"/><text x="25" y="34" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">A</text>
    <text x="55" y="36" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle">+</text>

    <g transform="translate(75, 14)">
      <circle cx="0" cy="16" r="16" fill="#3b82f6"/><text x="0" y="20" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B</text>
      <circle cx="24" cy="16" r="16" fill="#10b981"/><text x="24" y="20" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">C</text>
    </g>

    <line x1="140" y1="30" x2="185" y2="30" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="190,30 181,25 181,35" fill="#38bdf8"/>

    <!-- New compound AC + free displaced B -->
    <g transform="translate(225, 14)">
      <circle cx="0" cy="16" r="16" fill="#f59e0b"/><text x="0" y="20" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">A</text>
      <circle cx="24" cy="16" r="16" fill="#10b981"/><text x="24" y="20" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">C</text>
    </g>
    <text x="275" y="36" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle">+</text>
    <circle cx="305" cy="30" r="16" fill="#3b82f6"/><text x="305" y="34" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">B</text>
  </g>

  <rect x="70" y="200" width="400" height="24" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
  <text x="270" y="216" fill="#fde68a" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Displacement occurs when element A has higher reactivity than displaced B</text>

  </g>

  <!-- Bottom Educational Concept Bar -->
  <rect x="50" y="240" width="440" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="256" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Displacement Mechanism: A Free Reactive Element Replaces an Ion in Compound</text>
</svg>