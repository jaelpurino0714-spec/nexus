<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h32" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h32" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h32" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h32" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h32" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h32" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h32)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h32)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 32</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h32)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- High Pressure Stimulus -->
  <g transform="translate(60, 75)">
    <circle cx="50" cy="50" r="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="50" y="42" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HIGH BP</text>
    <text x="50" y="58" fill="#f87171" font-family="sans-serif" font-size="9" text-anchor="middle">&gt; 120/80 mmHg</text>
    <text x="50" y="70" fill="#fecaca" font-family="sans-serif" font-size="8" text-anchor="middle">(Vessel Stretch)</text>
  </g>

  <!-- Baroreceptors &amp; Brainstem -->
  <path d="M 120,125 L 180,125" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="185,125 178,121 178,129" fill="#f59e0b"/>
  <g transform="translate(190, 80)">
    <rect x="0" y="0" width="130" height="85" rx="8" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="65" y="20" fill="#60a5fa" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">MEDULLA CENTER</text>
    <text x="65" y="45" fill="#a7f3d0" font-family="sans-serif" font-size="9">Parasympathetic ↑</text>
    <text x="65" y="62" fill="#fca5a5" font-family="sans-serif" font-size="9">Sympathetic ↓</text>
  </g>

  <!-- Effectors: Heart &amp; Arterioles -->
  <path d="M 325,125 L 350,125" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="355,125 348,121 348,129" fill="#10b981"/>
  <g transform="translate(360, 75)">
    <rect x="0" y="0" width="130" height="95" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.8"/>
    <text x="65" y="22" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CORRECTIVE EFFECT</text>
    <text x="65" y="45" fill="#a7f3d0" font-family="sans-serif" font-size="9">Heart Rate ↓ (Bradycardia)</text>
    <text x="65" y="62" fill="#a7f3d0" font-family="sans-serif" font-size="9">Arterioles Dilate ↓</text>
    <text x="65" y="80" fill="#6ee7b7" font-family="sans-serif" font-size="9" font-weight="bold">BP Restored to 120/80</text>
  </g>

  <text x="270" y="215" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Baroreceptors signal autonomic division to lower cardiac output and tone</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Baroreceptor Reflex: Compensatory Pressure-Lowering Response</text>
</svg>