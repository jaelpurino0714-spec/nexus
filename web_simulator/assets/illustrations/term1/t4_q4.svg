<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t4_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t4_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t4_4)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#8b5cf6" filter="url(#glow_t4_4)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 4: CHEMICAL EQUATIONS &amp; FORMULAS • Q4</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#8b5cf6"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="245" y="28" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="0.5">PHYSICAL STATES OF MATTER IN EQUATIONS</text>

      <g transform="translate(20, 48)">
        <!-- Solid -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="102" height="110" rx="10" fill="#1e1b4b" stroke="#94a3b8" stroke-width="1.5"/>
          <text x="51" y="48" fill="#ffffff" font-family="'Consolas', monospace" font-size="26" font-weight="900" text-anchor="middle">(s)</text>
          <rect x="12" y="68" width="78" height="26" rx="6" fill="#334155"/>
          <text x="51" y="85" fill="#f8fafc" font-size="12" font-weight="900" text-anchor="middle">SOLID</text>
        </g>
        <!-- Liquid -->
        <g transform="translate(116, 0)">
          <rect x="0" y="0" width="102" height="110" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="51" y="48" fill="#38bdf8" font-family="'Consolas', monospace" font-size="26" font-weight="900" text-anchor="middle">(l)</text>
          <rect x="12" y="68" width="78" height="26" rx="6" fill="#0369a1"/>
          <text x="51" y="85" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">LIQUID</text>
        </g>
        <!-- Gas -->
        <g transform="translate(232, 0)">
          <rect x="0" y="0" width="102" height="110" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="51" y="48" fill="#f59e0b" font-family="'Consolas', monospace" font-size="26" font-weight="900" text-anchor="middle">(g) ↑</text>
          <rect x="12" y="68" width="78" height="26" rx="6" fill="#b45309"/>
          <text x="51" y="85" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">GAS</text>
        </g>
        <!-- Aqueous -->
        <g transform="translate(348, 0)">
          <rect x="0" y="0" width="102" height="110" rx="10" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
          <text x="51" y="48" fill="#34d399" font-family="'Consolas', monospace" font-size="26" font-weight="900" text-anchor="middle">(aq)</text>
          <rect x="6" y="68" width="90" height="26" rx="6" fill="#047857"/>
          <text x="51" y="85" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">AQUEOUS</text>
        </g>
      </g>
    </g>
    
</svg>