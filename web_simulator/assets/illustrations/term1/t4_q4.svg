<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t4_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t4_4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t4_4)" stroke="#8b5cf6" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#8b5cf6" filter="url(#glow_t4_4)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 4: CHEMICAL EQUATIONS &amp; FORMULAS • Q4</text>
  
  <rect x="390" y="17" width="120" height="22" rx="11" fill="#8b5cf6"/>
  <text x="450" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(45, 55)">
      <rect x="0" y="0" width="450" height="130" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="225" y="26" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">PHYSICAL STATES OF MATTER IN EQUATIONS</text>

      <g transform="translate(25, 45)">
        <rect x="0" y="0" width="90" height="65" rx="8" fill="#1e1b4b" stroke="#94a3b8" stroke-width="1"/>
        <text x="45" y="28" fill="#ffffff" font-family="'Consolas', monospace" font-size="15" font-weight="900" text-anchor="middle">(s)</text>
        <text x="45" y="48" fill="#94a3b8" font-size="9.5" font-weight="bold" text-anchor="middle">SOLID</text>
      </g>
      <g transform="translate(125, 45)">
        <rect x="0" y="0" width="90" height="65" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
        <text x="45" y="28" fill="#38bdf8" font-family="'Consolas', monospace" font-size="15" font-weight="900" text-anchor="middle">(l)</text>
        <text x="45" y="48" fill="#38bdf8" font-size="9.5" font-weight="bold" text-anchor="middle">LIQUID</text>
      </g>
      <g transform="translate(225, 45)">
        <rect x="0" y="0" width="90" height="65" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
        <text x="45" y="28" fill="#f59e0b" font-family="'Consolas', monospace" font-size="15" font-weight="900" text-anchor="middle">(g) ↑</text>
        <text x="45" y="48" fill="#f59e0b" font-size="9.5" font-weight="bold" text-anchor="middle">GAS</text>
      </g>
      <g transform="translate(325, 45)">
        <rect x="0" y="0" width="95" height="65" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1"/>
        <text x="47" y="28" fill="#34d399" font-family="'Consolas', monospace" font-size="15" font-weight="900" text-anchor="middle">(aq)</text>
        <text x="47" y="48" fill="#34d399" font-size="8.5" font-weight="bold" text-anchor="middle">AQUEOUS (H₂O)</text>
      </g>
    </g>
    
</svg>