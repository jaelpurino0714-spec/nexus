  <rect x="415" y="20" width="95" height="22" rx="11" fill="#10b981"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Diagram Visual Body -->
  <g transform="translate(0, 10)">
    
          <g transform="translate(80, 80)">
            <rect x="0" y="0" width="150" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
