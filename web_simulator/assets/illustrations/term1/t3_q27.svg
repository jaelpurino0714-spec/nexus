<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t3_27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t3_27" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t3_27)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#ec4899" filter="url(#glow_t3_27)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 3: ACIDS AND BASES • Q27</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#ec4899"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">LAB BEAKER</text>

  <!-- Main Illustration Artwork -->
  
    <defs>
      <linearGradient id="liq_10b981_9982" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#10b981" stop-opacity="0.95"/>
      </linearGradient>
      <linearGradient id="shine_10b981_9982" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
        <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
        <stop offset="85%" stop-color="#ffffff" stop-opacity="0.0"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
      </linearGradient>
    </defs>

    <!-- Center Laboratory Glassware -->
    <g transform="translate(195, 48)">
      <ellipse cx="75" cy="178" rx="68" ry="12" fill="#000000" opacity="0.6"/>

      <!-- Liquid fill -->
      <path d="M 12 70 Q 75 84 138 70 L 138 165 Q 138 175 125 175 L 25 175 Q 12 175 12 165 Z" fill="url(#liq_10b981_9982)"/>
      <ellipse cx="75" cy="71" rx="63" ry="9" fill="#10b981" opacity="0.9"/>
      <ellipse cx="75" cy="71" rx="55" ry="6" fill="#ffffff" opacity="0.25"/>

      <!-- Bubbles -->
      <circle cx="45" cy="140" r="5" fill="#ffffff" opacity="0.5"/>
      <circle cx="58" cy="110" r="3.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="95" cy="130" r="5.5" fill="#ffffff" opacity="0.55"/>
      <circle cx="108" cy="95" r="4" fill="#ffffff" opacity="0.7"/>
      <circle cx="75" cy="150" r="4.5" fill="#ffffff" opacity="0.4"/>

      <!-- Litmus paper strip -->
      <g transform="rotate(8 75 75)">
        <rect x="68" y="10" width="16" height="60" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
        <rect x="68" y="70" width="16" height="55" rx="3" fill="#10b981" stroke="#ffffff" stroke-width="1" opacity="0.95"/>
      </g>

      <!-- Glass Outline & Spout -->
      <path d="M 0 32 L 10 35 L 10 165 Q 10 178 25 178 L 125 178 Q 140 178 140 165 L 140 35 L 142 32" 
            fill="url(#shine_10b981_9982)" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="75" cy="35" rx="65" ry="7" fill="none" stroke="#93c5fd" stroke-width="2.5"/>

      <!-- Measurement tick marks -->
      <g stroke="#ffffff" stroke-width="2" opacity="0.85" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#ffffff" font-weight="900">
        <line x1="118" y1="62" x2="135" y2="62"/><text x="112" y="65" text-anchor="end">200ml</text>
        <line x1="122" y1="92" x2="135" y2="92"/><text x="112" y="95" text-anchor="end">150ml</text>
        <line x1="118" y1="122" x2="135" y2="122"/><text x="112" y="125" text-anchor="end">100ml</text>
        <line x1="122" y1="148" x2="135" y2="148"/><text x="112" y="151" text-anchor="end">50ml</text>
      </g>
    </g>

    <!-- Left Info Card -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="155" height="75" rx="12" fill="#1e1b4b" fill-opacity="0.95" stroke="#10b981" stroke-width="2"/>
      <text x="77" y="28" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Neutral Solution (H₂O)</text>
      <rect x="20" y="38" width="115" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="77" y="57" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">pH = 7</text>
    </g>

    <!-- Right Result Card -->
    <g transform="translate(360, 75)">
      <rect x="0" y="0" width="155" height="75" rx="12" fill="#1e1b4b" fill-opacity="0.95" stroke="#10b981" stroke-width="2"/>
      <text x="77" y="28" fill="#c4b5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">INDICATOR RESULT</text>
      <rect x="20" y="38" width="115" height="28" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="77" y="57" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">[ ? ]</text>
    </g>
    
</svg>