<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t2_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <linearGradient id="heat_grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow_t2_8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t2_8)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#6366f1" filter="url(#glow_t2_8)"/>
  <text x="50" y="32" fill="#6366f1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 2: TYPES OF CHEMICAL REACTIONS • Q8</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#6366f1"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION TYPE</text>

  <!-- Main Illustration Artwork -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#6366f1" stroke-width="2"/>

    <!-- Labels Above Columns -->
    <rect x="20" y="14" width="165" height="26" rx="7" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="102" y="31" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">SINGLE REACTANT</text>

    <rect x="260" y="14" width="210" height="26" rx="7" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
    <text x="365" y="31" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">SIMPLER PRODUCTS</text>

    <!-- Specific Equation Display Box -->
    <rect x="15" y="48" width="460" height="74" rx="10" fill="#1e293b" fill-opacity="0.95" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Reactant: CaCO3 -->
    <g transform="translate(30, 62)">
      <rect x="0" y="0" width="120" height="46" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="60" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">CaCO<tspan font-size="14" dy="4">3</tspan></text>
    </g>

    <!-- Arrow with Heat (Δ) -->
    <g transform="translate(160, 70)">
      <line x1="5" y1="15" x2="75" y2="15" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="80,15 70,10 70,20" fill="#f59e0b"/>
      <!-- Heat Symbol Δ -->
      <polygon points="42,2 48,11 36,11" fill="url(#heat_grad)"/>
      <text x="42" y="-1" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle">HEAT (Δ)</text>
    </g>

    <!-- Products: CaO + CO2 -->
    <g transform="translate(250, 62)">
      <!-- CaO -->
      <rect x="0" y="0" width="95" height="46" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
      <text x="47" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">CaO</text>
      
      <!-- + sign -->
      <text x="110" y="32" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle">+</text>

      <!-- CO2 -->
      <rect x="125" y="0" width="95" height="46" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
      <text x="172" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">CO<tspan font-size="14" dy="4">2</tspan><tspan font-size="16" dy="-4"> ↑</tspan></text>
    </g>

    <!-- Sub-note & Classification Prompt Badge -->
    <g transform="translate(20, 134)">
      <rect x="0" y="0" width="280" height="38" rx="8" fill="#1e1b4b" stroke="#475569" stroke-width="1"/>
      <circle cx="18" cy="19" r="6" fill="#38bdf8"/>
      <text x="32" y="24" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1 Compound Splits into 2 Substances</text>
      
      <rect x="290" y="0" width="160" height="38" rx="8" fill="#312e81" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="370" y="24" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">TYPE = [ ? ]</text>
    </g>
  </g>
</svg>