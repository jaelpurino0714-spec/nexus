<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t8_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <filter id="glow_t8_1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t8_1)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.06" stroke="#8b5cf6" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/>
    <line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/>
    <line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#8b5cf6" filter="url(#glow_t8_1)"/>
  <text x="50" y="35" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 8: MECHANISMS OF EVOLUTION • Q1</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="#38bdf8"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REMEMBERING</text>

  <!-- Diagram Visual Body -->
  <g transform="translate(0, 10)">
    
          <!-- Evolutionary Tree branches -->
          <g transform="translate(140, 75)">
            <line x1="130" y1="90" x2="130" y2="50" stroke="#8b5cf6" stroke-width="3"/>
            <line x1="130" y1="50" x2="60" y2="15" stroke="#8b5cf6" stroke-width="2.5"/>
            <line x1="130" y1="50" x2="200" y2="15" stroke="#38bdf8" stroke-width="2.5"/>
            <circle cx="60" cy="15" r="6" fill="#8b5cf6"/>
            <text x="60" y="0" fill="#8b5cf6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Species A</text>
            <circle cx="200" cy="15" r="6" fill="#38bdf8"/>
            <text x="200" y="0" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Species B</text>
            <circle cx="130" cy="90" r="7" fill="#ffffff"/>
            <text x="130" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Common Ancestor</text>
          </g>
          <text x="270" y="200" fill="#8b5cf6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Natural Selection • Homologous Structures • Genetic Variation</text>
        
  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="238" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="254" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Concept: Population Change</text>
</svg>