<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t6_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t6_15" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t6_15)" stroke="#ec4899" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#ec4899" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#ec4899" filter="url(#glow_t6_15)"/>
  <text x="50" y="32" fill="#ec4899" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 6: CHEMICAL REACTION RATES • Q15</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#ec4899"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">COLLISIONS</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(80, 55)">
      <!-- Cold Vessel (Slow) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
        <text x="80" y="22" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LOW TEMP (SLOW)</text>
        <circle cx="40" cy="50" r="6" fill="#38bdf8"/>
        <circle cx="120" cy="60" r="6" fill="#38bdf8"/>
        <circle cx="70" cy="90" r="6" fill="#38bdf8"/>
        <circle cx="130" cy="95" r="6" fill="#38bdf8"/>
      </g>

      <!-- Hot Vessel (Fast & Collisions) -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="160" height="120" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
        <text x="80" y="22" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HIGH TEMP (FAST 🔥)</text>
        <!-- Particles with speed streaks -->
        <circle cx="45" cy="55" r="6" fill="#f87171"/>
        <line x1="25" y1="55" x2="40" y2="55" stroke="#fca5a5" stroke-width="2"/>
        <circle cx="115" cy="55" r="6" fill="#f87171"/>
        <line x1="135" y1="55" x2="120" y2="55" stroke="#fca5a5" stroke-width="2"/>
        <!-- Collision starburst in center -->
        <polygon points="80,50 83,57 90,57 85,62 87,69 80,65 73,69 75,62 70,57 77,57" fill="#fbbf24"/>
        <circle cx="65" cy="95" r="6" fill="#f87171"/>
        <circle cx="125" cy="95" r="6" fill="#f87171"/>
      </g>
    </g>
    
</svg>