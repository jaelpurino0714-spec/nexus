<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t5_19" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t5_19" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t5_19)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#8b5cf6" filter="url(#glow_t5_19)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 5: BALANCING CHEMICAL EQUATIONS • Q19</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#8b5cf6"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(70, 48)">
      <rect x="0" y="0" width="400" height="185" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
      <text x="200" y="28" fill="#fb923c" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">OXIDATION &amp; RUSTING (CHEMICAL CHANGE)</text>

      <!-- Iron Nail with Rust Coating -->
      <g transform="translate(60, 50)">
        <polygon points="20,15 260,15 280,25 260,35 20,35" fill="#64748b" stroke="#334155" stroke-width="2"/>
        <rect x="12" y="8" width="12" height="34" rx="2" fill="#475569"/>
        <!-- Rust Spots -->
        <ellipse cx="90" cy="25" rx="28" ry="8" fill="#ea580c" opacity="0.9"/>
        <ellipse cx="170" cy="23" rx="40" ry="9" fill="#c2410c" opacity="0.95"/>
        <ellipse cx="230" cy="27" rx="25" ry="7" fill="#ea580c" opacity="0.9"/>
      </g>

      <g transform="translate(40, 115)">
        <rect x="0" y="0" width="320" height="50" rx="10" fill="#1e1b4b" stroke="#f97316" stroke-width="1.2"/>
        <text x="160" y="24" fill="#fed7aa" font-family="'Consolas', monospace" font-size="16" font-weight="900" text-anchor="middle">
          4 Fe  +  3 O₂  →  2 Fe₂O₃ (Rust)
        </text>
        <text x="160" y="42" fill="#fb923c" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">New Chemical Substance Formed</text>
      </g>
    </g>
    
</svg>