<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h39" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h39)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h39)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 39</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h39)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Enzyme Rate vs Temperature Curve -->
  <g transform="translate(90, 70)">
    <line x1="30" y1="110" x2="330" y2="110" stroke="#64748b" stroke-width="1.5"/>
    <line x1="30" y1="15" x2="30" y2="110" stroke="#64748b" stroke-width="1.5"/>
    <text x="330" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">Temperature (°C)</text>
    <text x="25" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9">Rate</text>

    <!-- Temperature markers -->
    <text x="130" y="125" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">37°C</text>
    <text x="230" y="125" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">&gt;40°C</text>

    <!-- Activity curve -->
    <path d="M 30,105 Q 100,80 130,25 Q 160,25 200,60 L 240,110" fill="none" stroke="#f59e0b" stroke-width="3"/>

    <!-- Peak Optimal Marker -->
    <circle cx="130" cy="25" r="4" fill="#10b981"/>
    <text x="130" y="16" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Optimal Activity</text>

    <!-- Precipitous Drop Denaturation Zone -->
    <rect x="210" y="25" width="105" height="50" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="262" y="42" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DENATURATION</text>
    <text x="262" y="55" fill="#fca5a5" font-family="sans-serif" font-size="8" text-anchor="middle">Tertiary bonds break</text>
    <text x="262" y="66" fill="#fca5a5" font-family="sans-serif" font-size="8" text-anchor="middle">Active site collapses</text>
  </g>

  <rect x="70" y="215" width="400" height="22" rx="5" fill="#1e1b4b" stroke="#ef4444" stroke-width="1"/>
  <text x="270" y="230" fill="#fca5a5" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">High thermal kinetic energy unravels critical enzymatic catalytic proteins</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hyperthermia Threshold: Protein Denaturation in Prolonged High Fever</text>
</svg>