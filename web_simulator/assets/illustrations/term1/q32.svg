<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#0f112e"/>
      <stop offset="100%" stop-color="#16183d"/>
    </linearGradient>
    <linearGradient id="neon_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neon_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neon_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="neon_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neon_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_32" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bg_32)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
    <line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Top Header Ribbon -->
  <rect x="20" y="16" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="33" r="5" fill="#38bdf8" filter="url(#glow_32)"/>
  <text x="50" y="38" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">RATES OF CHEMICAL REACTIONS</text>
  <rect x="420" y="22" width="90" height="22" rx="11" fill="url(#neon_purple)"/>
  <text x="465" y="37" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Diagram Content Area -->
  <g transform="translate(0, 10)">
    
  <!-- Large Volume V1 -->
  <g transform="translate(80, 70)">
    <rect x="0" y="30" width="130" height="110" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="20" width="130" height="10" fill="#475569"/>
    <circle cx="30" cy="65" r="5" fill="#38bdf8"/><circle cx="100" cy="60" r="5" fill="#38bdf8"/>
    <circle cx="65" cy="100" r="5" fill="#38bdf8"/><circle cx="40" cy="120" r="5" fill="#38bdf8"/>
    <text x="65" y="160" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Large Volume (V₁)</text>
  </g>

  <!-- Arrow Compression -->
  <g transform="translate(225, 110)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 45 -5 L 55 0 L 45 5 Z" fill="#f59e0b"/>
    <text x="25" y="-10" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Compressed</text>
  </g>

  <!-- Small Compressed Volume V2 -->
  <g transform="translate(300, 70)">
    <rect x="0" y="65" width="130" height="75" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow_32)"/>
    <rect x="0" y="55" width="130" height="10" fill="#38bdf8"/>
    <!-- dense particles -->
    <circle cx="25" cy="85" r="5" fill="#00f0ff"/><circle cx="55" cy="80" r="5" fill="#00f0ff"/>
    <circle cx="85" cy="85" r="5" fill="#00f0ff"/><circle cx="110" cy="80" r="5" fill="#00f0ff"/>
    <circle cx="40" cy="115" r="5" fill="#00f0ff"/><circle cx="70" cy="120" r="5" fill="#00f0ff"/>
    <circle cx="100" cy="115" r="5" fill="#00f0ff"/>
    <text x="65" y="160" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Small Vol / High Pressure (P₂)</text>
  </g>

  <rect x="110" y="222" width="320" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
  <text x="270" y="238" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Factor: Increased Gas Concentration / Pressure</text>

  </g>
</svg>