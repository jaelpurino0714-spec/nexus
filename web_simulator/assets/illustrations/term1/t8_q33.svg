      <text x="210" y="26" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">DNA VARIATION &amp; MUTATIONS (SOURCE OF DIVERSITY)</text>

      <g transform="translate(110, 42)">
