<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t1_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t1_2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow_t1_2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t1_2)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#38bdf8" filter="url(#glow_t1_2)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL VS. CHEMICAL CHANGE • Q2</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t1_2)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
  <!-- Ice block vs Crushed ice -->
  <g transform="translate(70, 75)">
    <!-- Solid block -->
    <rect x="0" y="10" width="130" height="95" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="25" y="30" width="80" height="50" rx="4" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="65" y="58" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">H₂O SOLID</text>
    <text x="65" y="94" fill="#bae6fd" font-family="sans-serif" font-size="9" text-anchor="middle">Macro Ice Block</text>
  </g>

  <!-- Crushing Force -->
  <g transform="translate(225, 95)">
    <line x1="0" y1="25" x2="60" y2="25" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="65,25 55,20 55,30" fill="#f59e0b"/>
    <text x="32" y="15" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CRUSH</text>
  </g>

  <!-- Crushed Fragments -->
  <g transform="translate(310, 75)">
    <rect x="0" y="10" width="160" height="95" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Small ice crystals -->
    <polygon points="30,45 42,35 50,48 38,55" fill="#38bdf8"/>
    <polygon points="60,60 75,50 82,65 68,72" fill="#7dd3fc"/>
    <polygon points="90,40 105,32 112,48 98,52" fill="#bae6fd"/>
    <polygon points="120,62 135,55 140,68 128,75" fill="#38bdf8"/>
    <text x="80" y="94" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Chemical Identity Unchanged (Still H₂O)</text>
  </g>

  </g>

  <!-- Bottom Educational Concept Bar -->
  <rect x="50" y="240" width="440" height="24" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="256" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Physical Transformation: Mechanical Crushing Preserves H₂O Identity</text>
</svg>