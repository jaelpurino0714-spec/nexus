<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t7_15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t7_15" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t7_15)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#06b6d4" filter="url(#glow_t7_15)"/>
  <text x="50" y="32" fill="#06b6d4" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS &amp; REGULATION • Q15</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#06b6d4"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">KIDNEY</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(195, 50)">
      <!-- Kidney silhouette -->
      <path d="M 70 20 C 130 20, 160 80, 140 130 C 120 170, 70 180, 45 160 C 20 140, 10 90, 30 50 C 45 30, 55 20, 70 20 Z" 
            fill="#991b1b" stroke="#f87171" stroke-width="2.5"/>
      <!-- Indented hilum -->
      <path d="M 30 80 Q 60 100 35 125" fill="none" stroke="#1e293b" stroke-width="8"/>

      <!-- Renal vessels -->
      <path d="M 45 92 L 15 92" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
      <path d="M 45 110 L 15 110" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
      <path d="M 45 125 L 30 175" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>

      <!-- Water droplets -->
      <circle cx="120" cy="155" r="6" fill="#38bdf8"/>
      <circle cx="138" cy="145" r="4.5" fill="#38bdf8"/>
    </g>

    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f87171" stroke-width="1.5"/>
      <text x="62" y="22" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OSMOREGULATION</text>
      <text x="62" y="40" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">Fluid Filtration</text>
    </g>

    <g transform="translate(370, 95)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f87171" stroke-width="1.5"/>
      <text x="62" y="22" fill="#a5a3c4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">HOMEOSTATIC ROLE</text>
      <text x="62" y="40" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">[ ? ]</text>
