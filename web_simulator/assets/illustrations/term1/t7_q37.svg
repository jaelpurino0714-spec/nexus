<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_h37" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c152e"/>
      <stop offset="100%" stop-color="#121e42"/>
    </linearGradient>
    <linearGradient id="cyanGrad_h37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad_h37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad_h37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad_h37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="redGrad_h37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow_h37" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_h37)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.4"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Ribbon -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#06b6d4" filter="url(#glow_h37)"/>
  <text x="50" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS • QUESTION 37</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#purpleGrad_h37)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">UNDERSTANDING</text>

  <!-- Bespoke Question Illustration -->
  <g transform="translate(0, 10)">
    
  <!-- Vasoconstriction -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="175" height="115" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="87" y="22" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">1. VASOCONSTRICTION</text>
    <!-- Constricted narrow vessel -->
    <rect x="35" y="38" width="105" height="8" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="87" y="60" fill="#fca5a5" font-family="sans-serif" font-size="8.5" text-anchor="middle">Dermal vessels narrow</text>
    <text x="87" y="78" fill="#93c5fd" font-family="sans-serif" font-size="8.5" text-anchor="middle">Blood shunted to core</text>
    <text x="87" y="96" fill="#38bdf8" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Heat loss minimized</text>
  </g>

  <!-- Shivering Thermogenesis -->
  <g transform="translate(285, 75)">
    <rect x="0" y="0" width="175" height="115" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="87" y="22" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2. SHIVERING</text>
    <!-- Muscle fiber zig-zags -->
    <path d="M 40,48 L 55,38 L 70,48 L 85,38 L 100,48 L 115,38 L 130,48" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <text x="87" y="66" fill="#fde68a" font-family="sans-serif" font-size="8.5" text-anchor="middle">Involuntary contractions</text>
    <text x="87" y="82" fill="#fde68a" font-family="sans-serif" font-size="8.5" text-anchor="middle">ATP breakdown generates</text>
    <text x="87" y="98" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Metabolic Heat (ΔH)</text>
  </g>

  <rect x="90" y="208" width="360" height="22" rx="5" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1"/>
  <text x="270" y="223" fill="#38bdf8" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Dual strategy: Retain core thermal energy while actively producing heat</text>

  </g>

  <!-- Bottom Concept Badge -->
  <rect x="60" y="240" width="420" height="24" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="270" y="256" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cold Defense Reflexes: Cutaneous Vasoconstriction + Shivering</text>
</svg>