<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t3_30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t3_30" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow_t3_30" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t3_30)" stroke="#10b981" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#10b981" filter="url(#glow_t3_30)"/>
  <text x="50" y="35" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 3: ACIDS, BASES, AND SALTS • Q30</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t3_30)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
        <g transform="translate(50, 75)">
          &lt;!-- pH Gradient Bar -->
          <rect x="0" y="30" width="440" height="32" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="2"/>
          <line x1="20" y1="46" x2="420" y2="46" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
          &lt;!-- Scale markers -->
          <text x="25" y="22" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">0 (Battery Acid)</text>
          <text x="220" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">7.0 (Pure Water)</text>
          <text x="415" y="22" fill="#8b5cf6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">14 (Bleach / Lye)</text>
          <text x="220" y="88" fill="#a7f3d0" font-family="sans-serif" font-size="9.5" text-anchor="middle">Neutral: [H⁺] = [OH⁻] = 1.0 × 10⁻⁷ M at 25°C</text>
        </g>
  </g>

  <!-- Bottom Educational Concept Bar -->
  <rect x="50" y="240" width="440" height="24" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="256" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Universal pH Scale Spectrum: 0 (Acidic) to 7 (Neutral) to 14 (Basic)</text>
</svg>