<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t5_32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t5_32" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t5_32)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#8b5cf6" filter="url(#glow_t5_32)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 5: BALANCING CHEMICAL EQUATIONS • Q32</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#8b5cf6"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="490" height="185" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#6366f1" stroke-width="2"/>

      <!-- Reactants / Products Header Pills -->
      <rect x="25" y="16" width="180" height="28" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="115" y="34" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTANTS (BEFORE)</text>

      <rect x="285" y="16" width="180" height="28" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1.2"/>
      <text x="375" y="34" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">PRODUCTS (AFTER)</text>

      <!-- Center Prominent Equation Box -->
      <rect x="20" y="56" width="450" height="66" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.5"/>
      <text x="245" y="98" fill="#ffffff" font-family="'Consolas', 'Courier New', monospace" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1">
        2 H₂ + O₂  →  2 H₂O
      </text>

      <!-- Sub-note and Unknown Target Badge -->
      <g transform="translate(25, 134)">
        <rect x="0" y="0" width="280" height="36" rx="8" fill="#1e1b4b" stroke="#475569" stroke-width="1"/>
        <text x="15" y="23" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">4 H + 2 O  =  4 H + 2 O atoms</text>
        
        <rect x="295" y="0" width="150" height="36" rx="8" fill="#312e81" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="370" y="24" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" text-anchor="middle">[ Balanced ]</text>
      </g>
    </g>
    
</svg>