<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t1_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t1_1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow_t1_1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bgGrad_t1_1)" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="250"/><line x1="140" y1="0" x2="140" y2="250"/>
    <line x1="220" y1="0" x2="220" y2="250"/><line x1="300" y1="0" x2="300" y2="250"/>
    <line x1="380" y1="0" x2="380" y2="250"/><line x1="460" y1="0" x2="460" y2="250"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/>
  </g>

  <!-- Clean Top Header Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#38bdf8" filter="url(#glow_t1_1)"/>
  <text x="50" y="32" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 1: PHYSICAL VS. CHEMICAL CHANGE • Q1</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="url(#primaryGrad_t1_1)"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Pure Scientific Illustration Area (Clean, Centered, No Answer Spoilers) -->
  <g transform="translate(0, 10)">
    
        <g transform="translate(100, 45)">
          <rect x="0" y="0" width="150" height="135" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="75" y="24" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Sample A</text>
          <circle cx="75" cy="70" r="30" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
          <path d="M 75,40 L 75,32 M 70,36 L 80,36" stroke="#16a34a" stroke-width="3"/>
          <text x="75" y="120" fill="#bae6fd" font-size="9" text-anchor="middle">Fresh Produce</text>
        </g>
        <g transform="translate(290, 45)">
          <rect x="0" y="0" width="150" height="135" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="75" y="24" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Sample B</text>
          <path d="M 50,75 Q 65,50 95,60 Q 110,80 100,95 Q 70,105 50,75 Z" fill="#713f12" stroke="#a16207" stroke-width="2"/>
          <path d="M 60,45 Q 70,35 60,25 M 90,45 Q 100,35 90,25" stroke="#eab308" stroke-width="2" fill="none"/>
          <text x="75" y="120" fill="#fde68a" font-size="9" text-anchor="middle">Decomposing Tissue</text>
        </g>
  </g>
</svg>