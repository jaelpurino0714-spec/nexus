<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t6_38" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t6_38" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t6_38)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#f59e0b" filter="url(#glow_t6_38)"/>
  <text x="50" y="32" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 6: FACTORS AFFECTING REACTION RATES • Q38</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#f59e0b"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION RATE</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="480" height="185" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <text x="240" y="28" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">SURFACE AREA EFFECT ON REACTION RATE</text>

      <!-- Large Single Chunk -->
      <g transform="translate(35, 45)">
        <rect x="0" y="0" width="190" height="95" rx="10" fill="#1e1b4b" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="95" y="24" fill="#94a3b8" font-size="12" font-weight="900" text-anchor="middle">LARGE SOLID CHUNK</text>
        <rect x="65" y="38" width="60" height="40" rx="6" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
        <text x="95" y="90" fill="#94a3b8" font-size="10.5" font-weight="bold" text-anchor="middle">Low Surface Area: Slow</text>
      </g>

      <!-- Crushed Powdered Particles -->
      <g transform="translate(255, 45)">
        <rect x="0" y="0" width="190" height="95" rx="10" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
        <text x="95" y="24" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle">CRUSHED POWDER</text>
        <circle cx="65" cy="50" r="6" fill="#34d399"/><circle cx="85" cy="50" r="6" fill="#34d399"/>
        <circle cx="105" cy="50" r="6" fill="#34d399"/><circle cx="125" cy="50" r="6" fill="#34d399"/>
        <circle cx="75" cy="68" r="6" fill="#34d399"/><circle cx="95" cy="68" r="6" fill="#34d399"/>
        <circle cx="115" cy="68" r="6" fill="#34d399"/>
        <text x="95" y="90" fill="#a7f3d0" font-size="10.5" font-weight="bold" text-anchor="middle">High Surface Area: Rapid</text>
      </g>

      <rect x="50" y="148" width="380" height="26" rx="6" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1"/>
      <text x="240" y="165" fill="#fef08a" font-size="11.5" font-weight="bold" text-anchor="middle">More Exposed Surface = Faster Collisions</text>
    </g>
    
</svg>