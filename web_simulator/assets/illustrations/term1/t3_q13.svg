<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t3_13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t3_13" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t3_13)" stroke="#10b981" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#10b981" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#10b981" filter="url(#glow_t3_13)"/>
  <text x="50" y="32" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 3: ACIDS, BASES, AND SALTS • Q13</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#10b981"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">ACID BEAKER</text>

  <!-- Main Illustration Artwork -->
  
    <defs>
      <linearGradient id="liq_ef4444_3306" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0.95"/>
      </linearGradient>
      <linearGradient id="shine_ef4444_3306" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
        <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
        <stop offset="85%" stop-color="#ffffff" stop-opacity="0.0"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
      </linearGradient>
    </defs>

    <g transform="translate(195, 45)">
      <!-- Shadow -->
      <ellipse cx="75" cy="180" rx="68" ry="12" fill="#000000" opacity="0.6"/>

      <!-- Liquid fill -->
      <path d="M 12 75 Q 75 88 138 75 L 138 165 Q 138 175 125 175 L 25 175 Q 12 175 12 165 Z" fill="url(#liq_ef4444_3306)"/>
      <!-- Meniscus curve -->
      <ellipse cx="75" cy="76" rx="63" ry="9" fill="#ef4444" opacity="0.9"/>
      <ellipse cx="75" cy="76" rx="55" ry="6" fill="#ffffff" opacity="0.25"/>

      <!-- Bubbles -->
      <circle cx="45" cy="145" r="4.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="58" cy="115" r="3" fill="#ffffff" opacity="0.6"/>
      <circle cx="95" cy="135" r="5" fill="#ffffff" opacity="0.55"/>
      <circle cx="108" cy="98" r="3.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="75" cy="155" r="4" fill="#ffffff" opacity="0.4"/>
      <circle cx="38" cy="92" r="2.5" fill="#ffffff" opacity="0.6"/>

      <!-- Litmus paper strip -->
      <g transform="rotate(8 75 75)">
        <rect x="68" y="15" width="14" height="60" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>
        <rect x="68" y="75" width="14" height="50" rx="2" fill="#ef4444" stroke="#ffffff" stroke-width="0.8" opacity="0.95"/>
      </g>

      <!-- Glass Outline & Spout -->
      <path d="M 0 35 L 10 38 L 10 165 Q 10 178 25 178 L 125 178 Q 140 178 140 165 L 140 38 L 142 35" 
            fill="url(#shine_ef4444_3306)" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="75" cy="38" rx="65" ry="7" fill="none" stroke="#93c5fd" stroke-width="2.5"/>

      <!-- Measurement tick marks -->
      <g stroke="#ffffff" stroke-width="1.8" opacity="0.75" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#ffffff" font-weight="bold">
        <line x1="120" y1="65" x2="135" y2="65"/><text x="115" y="68" text-anchor="end">200ml</text>
        <line x1="124" y1="95" x2="135" y2="95"/><text x="115" y="98" text-anchor="end">150ml</text>
        <line x1="120" y1="125" x2="135" y2="125"/><text x="115" y="128" text-anchor="end">100ml</text>
        <line x1="124" y1="150" x2="135" y2="150"/><text x="115" y="153" text-anchor="end">50ml</text>
      </g>

      <!-- Glass reflection highlight -->
      <path d="M 18 50 L 18 160 Q 18 168 26 168" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Side info badges -->
    <g transform="translate(45, 80)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5"/>
      <text x="62" y="22" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Acidic Solution</text>
      <text x="62" y="40" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">pH &lt; 7</text>
    </g>

    <g transform="translate(370, 80)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5"/>
      <text x="62" y="22" fill="#a5a3c4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">INDICATOR RESULT</text>
      <text x="62" y="40" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">[ ? ]</text>
    </g>
    
</svg>