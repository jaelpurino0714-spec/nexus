<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t6_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t6_7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t6_7)" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#f59e0b" filter="url(#glow_t6_7)"/>
  <text x="50" y="32" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 6: FACTORS AFFECTING REACTION RATES • Q7</text>
  
  <rect x="390" y="17" width="120" height="22" rx="11" fill="#f59e0b"/>
  <text x="450" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION RATE</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(190, 45)">
      <!-- Triangle outline -->
      <polygon points="80,15 150,135 10,135" fill="#1e1b4b" stroke="#f97316" stroke-width="3"/>
      <!-- Inner flame -->
      <circle cx="80" cy="90" r="22" fill="#ef4444" opacity="0.3"/>
      <text x="80" y="96" font-size="20" text-anchor="middle">🔥</text>

      <!-- 3 Sides Labels -->
      <text x="35" y="70" fill="#fde047" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" transform="rotate(-60 35 70)">1. FUEL</text>
      <text x="125" y="70" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" transform="rotate(60 125 70)">2. OXYGEN (O₂)</text>
      <text x="80" y="152" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">3. HEAT [ ? ]</text>
    </g>

    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="120" height="52" rx="10" fill="#1e1b4b" stroke="#f97316" stroke-width="1.5"/>
      <text x="60" y="22" fill="#fdba74" font-size="9" font-weight="bold" text-anchor="middle">COMBUSTION</text>
      <text x="60" y="40" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">Fire Triangle</text>
    </g>
    <g transform="translate(375, 95)">
      <rect x="0" y="0" width="120" height="52" rx="10" fill="#1e1b4b" stroke="#f97316" stroke-width="1.5"/>
      <text x="60" y="22" fill="#a5a3c4" font-size="9" font-weight="bold" text-anchor="middle">REQUIRED FACTOR</text>
      <text x="60" y="40" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">[ ? ]</text>
    </g>
    
</svg>