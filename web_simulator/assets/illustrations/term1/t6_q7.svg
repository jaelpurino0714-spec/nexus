<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t6_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t6_7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t6_7)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#f59e0b" filter="url(#glow_t6_7)"/>
  <text x="50" y="32" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 6: FACTORS AFFECTING REACTION RATES • Q7</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#f59e0b"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">REACTION RATE</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(120, 48)">
      <rect x="0" y="0" width="300" height="185" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <text x="150" y="28" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">FIRE TRIANGLE</text>

      <!-- Glowing Triangle Outline -->
      <polygon points="150,45 60,145 240,145" fill="#1e1b4b" stroke="#f97316" stroke-width="3"/>
      
      <!-- Triangle Labels -->
      <rect x="110" y="32" width="80" height="24" rx="6" fill="#b91c1c"/>
      <text x="150" y="48" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">HEAT</text>

      <rect x="25" y="132" width="75" height="24" rx="6" fill="#0284c7"/>
      <text x="62" y="148" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">OXYGEN</text>

      <rect x="200" y="132" width="75" height="24" rx="6" fill="#d97706"/>
      <text x="237" y="148" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">FUEL</text>

      <rect x="75" y="158" width="150" height="20" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
      <text x="150" y="172" fill="#fbbf24" font-size="10.5" font-weight="bold" text-anchor="middle">All 3 Required for Fire</text>
    </g>
    
</svg>