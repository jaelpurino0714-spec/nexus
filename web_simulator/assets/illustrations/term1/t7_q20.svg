<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t7_20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t7_20" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t7_20)" stroke="#06b6d4" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="12" width="500" height="32" rx="8" fill="#1e1b4b" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="36" cy="28" r="5" fill="#06b6d4" filter="url(#glow_t7_20)"/>
  <text x="50" y="32" fill="#06b6d4" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 7: HOMEOSTASIS &amp; REGULATION • Q20</text>
  
  <rect x="425" y="17" width="85" height="22" rx="11" fill="#06b6d4"/>
  <text x="467" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">PANCREAS</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(180, 50)">
      <!-- Pancreas Organ Silhouette -->
      <path d="M 20 60 C 50 30, 110 35, 140 50 C 160 60, 170 80, 150 95 C 120 115, 60 100, 30 90 C 15 85, 5 75, 20 60 Z" 
            fill="#d97706" opacity="0.85" stroke="#f59e0b" stroke-width="2"/>
      
      <!-- Endocrine Islet cells -->
      <circle cx="70" cy="65" r="9" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
      <text x="70" y="68" fill="#451a03" font-size="8" font-weight="900" text-anchor="middle">&#946;</text>
      <circle cx="105" cy="70" r="9" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
      <text x="105" y="73" fill="#1e3a8a" font-size="8" font-weight="900" text-anchor="middle">&#945;</text>
    </g>

    <g transform="translate(45, 95)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="62" y="22" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ENDOCRINE CONTROL</text>
      <text x="62" y="40" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">Insulin / Glucagon</text>
    </g>

    <g transform="translate(370, 95)">
      <rect x="0" y="0" width="125" height="52" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="62" y="22" fill="#a5a3c4" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BLOOD GLUCOSE</text>
      <text x="62" y="40" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">[ ? ]</text>
