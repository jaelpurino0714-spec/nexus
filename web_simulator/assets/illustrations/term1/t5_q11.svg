<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_t5_11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#121b36"/>
    </linearGradient>
    <filter id="glow_t5_11" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="250" rx="16" fill="url(#bg_t5_11)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Ambient Grid -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="90" y1="0" x2="90" y2="250"/><line x1="180" y1="0" x2="180" y2="250"/>
    <line x1="270" y1="0" x2="270" y2="250"/><line x1="360" y1="0" x2="360" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="0" y1="65" x2="540" y2="65"/><line x1="0" y1="130" x2="540" y2="130"/><line x1="0" y1="195" x2="540" y2="195"/>
  </g>

  <!-- Top Glassmorphism Banner -->
  <rect x="20" y="10" width="500" height="34" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="36" cy="27" r="5.5" fill="#8b5cf6" filter="url(#glow_t5_11)"/>
  <text x="50" y="32" fill="#8b5cf6" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">TOPIC 5: BALANCING CHEMICAL EQUATIONS • Q11</text>
  
  <rect x="385" y="15" width="125" height="24" rx="12" fill="#8b5cf6"/>
  <text x="447" y="31" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">EQUATION</text>

  <!-- Main Illustration Artwork -->
  
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="480" height="185" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
      <text x="240" y="28" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="900" text-anchor="middle">ACTIVATION ENERGY &amp; CATALYST PATHWAY</text>

      <g transform="translate(40, 45)">
        <!-- Energy Axis -->
        <line x1="30" y1="95" x2="380" y2="95" stroke="#475569" stroke-width="2"/>
        <line x1="30" y1="95" x2="30" y2="10" stroke="#475569" stroke-width="2"/>
        
        <!-- Reactants / Products Lines -->
        <line x1="30" y1="80" x2="90" y2="80" stroke="#38bdf8" stroke-width="4"/>
        <text x="60" y="96" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Reactants</text>

        <line x1="320" y1="80" x2="380" y2="80" stroke="#34d399" stroke-width="4"/>
        <text x="350" y="96" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Products</text>

        <!-- Uncatalyzed High Barrier -->
        <path d="M 90 80 Q 200 -10 320 80" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5,4"/>
        <text x="200" y="25" fill="#f87171" font-size="11" font-weight="900" text-anchor="middle">Uncatalyzed (High Ea)</text>

        <!-- Catalyzed Lower Barrier -->
        <path d="M 90 80 Q 200 35 320 80" fill="none" stroke="#34d399" stroke-width="3.5"/>
        <text x="200" y="60" fill="#34d399" font-size="11.5" font-weight="900" text-anchor="middle">With Catalyst (Lower Ea)</text>
      </g>

      <rect x="50" y="150" width="380" height="25" rx="6" fill="#1e1b4b" stroke="#c084fc" stroke-width="1"/>
      <text x="240" y="167" fill="#e9d5ff" font-size="11.5" font-weight="bold" text-anchor="middle">Catalysts Lower Activation Energy Without Being Consumed</text>
    </g>
    
</svg>