<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_t6_39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#141f3d"/>
    </linearGradient>
    <linearGradient id="primaryGrad_t6_39" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow_t6_39" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="280" rx="16" fill="url(#bgGrad_t6_39)" stroke="#f97316" stroke-width="1.3" stroke-opacity="0.45"/>

  <!-- Cyber Grid -->
  <g opacity="0.06" stroke="#f97316" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="380" y1="0" x2="380" y2="280"/><line x1="460" y1="0" x2="460" y2="280"/>
    <line x1="0" y1="60" x2="540" y2="60"/><line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="180" x2="540" y2="180"/><line x1="0" y1="240" x2="540" y2="240"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="14" width="500" height="34" rx="8" fill="#1e1b4b" fill-opacity="0.85" stroke="#f97316" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="36" cy="31" r="5" fill="#f97316" filter="url(#glow_t6_39)"/>
  <text x="50" y="35" fill="#f97316" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.5">TOPIC 6: RATES OF REACTIONS • Q39</text>
  
  <rect x="415" y="20" width="95" height="22" rx="11" fill="url(#primaryGrad_t6_39)"/>
  <text x="462" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="0.5">APPLYING</text>

  <!-- Bespoke Graphical Scene -->
  <g transform="translate(0, 10)">
    
        <g transform="translate(80, 75)">
          <line x1="20" y1="95" x2="350" y2="95" stroke="#64748b" stroke-width="1.5"/>
          <line x1="20" y1="10" x2="20" y2="95" stroke="#64748b" stroke-width="1.5"/>
          <text x="350" y="110" fill="#94a3b8" font-size="8">Reaction Progress</text>
          <text x="15" y="8" fill="#94a3b8" font-size="8">Energy</text>
          &lt;!-- Uncatalyzed High Hill -->
          <path d="M 20,70 Q 120,-10 220,70 L 340,70" fill="none" stroke="#ef4444" stroke-width="2.5"/>
          <text x="120" y="15" fill="#f87171" font-size="9" font-weight="bold">Uncatalyzed Eₐ</text>
          &lt;!-- Catalyzed Low Hill -->
          <path d="M 20,70 Q 120,30 220,70 L 340,70" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3,3"/>
          <text x="120" y="45" fill="#34d399" font-size="9" font-weight="bold">With Catalyst (Lower Eₐ)</text>
        </g>
  </g>

  <!-- Bottom Educational Concept Bar -->
  <rect x="50" y="240" width="440" height="24" rx="6" fill="#1e1b4b" stroke="#f97316" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="256" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Catalysis Mechanism: Lowers Activation Energy Barrier (Eₐ) Without Consumption</text>
</svg>